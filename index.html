<style>
:root{--navy:#1a2e4a;--navy2:#243d60;--gold:#c9a84c;--gold-light:#f5ecd7;--cream:#faf8f3;--danger:#c0392b;--warning:#c05000;--success:#1a7a4a;--info:#1a4a90}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--cream);color:#1a1a1a;font-size:14px}input,select,textarea,button{font-family:inherit;font-size:14px}.header{background:var(--navy);color:white;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25)}.header-left{display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border:2px solid var(--gold);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--gold);letter-spacing:-1px}.header-title{font-size:15px;font-weight:600;letter-spacing:.3px}.header-sub{font-size:11px;color:rgba(255,255,255,.55);margin-top:1px}.btn-nuevo{background:var(--gold);color:var(--navy);border:none;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}.btn-nuevo:hover{background:#dbb85a}.tabs-bar{background:var(--navy2);display:flex;gap:2px;padding:0 20px}.tab{padding:10px 20px;color:rgba(255,255,255,.55);cursor:pointer;font-size:13px;font-weight:500;border-bottom:3px solid transparent;transition:all .15s}.tab.active{color:var(--gold);border-bottom-color:var(--gold)}.tab:hover:not(.active){color:rgba(255,255,255,.8)}.stats-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#ddd;border-bottom:1px solid #ddd}.stat{background:white;padding:10px 14px;text-align:center}.stat-num{font-size:20px;font-weight:600}.stat-num.alerta{color:var(--danger)}.stat-num.warn{color:var(--warning)}.stat-num.ok{color:var(--success)}.stat-lbl{font-size:11px;color:#666;margin-top:1px}.alertas-bar{padding:8px 16px;display:flex;flex-direction:column;gap:5px;background:#fff9f0;border-bottom:1px solid #f0d8b0}.alerta-item{display:flex;align-items:center;gap:8px;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}.dot.rojo{background:#e74c3c}.dot.naranja{background:#e67e22}.toolbar{padding:10px 16px;display:flex;gap:8px;align-items:center;background:white;border-bottom:1px solid #e8e8e8;flex-wrap:wrap}.search-box{flex:1;min-width:200px;border:1px solid #ddd;border-radius:6px;padding:7px 12px;font-size:13px;background:#f7f7f7;outline:none}.search-box:focus{border-color:var(--gold);background:white}.filtro{padding:6px 12px;border:1px solid #ddd;border-radius:20px;font-size:12px;cursor:pointer;background:white;color:#555;transition:all .15s}.filtro.on{background:var(--navy);color:white;border-color:var(--navy)}.lista{padding:12px 16px;display:flex;flex-direction:column;gap:8px}.tarjeta{background:white;border:1px solid #e0e0e0;border-radius:10px;padding:14px 16px;cursor:pointer;transition:box-shadow .15s,border-color .15s;border-left:4px solid #e0e0e0}.tarjeta:hover{box-shadow:0 2px 12px rgba(0,0,0,.1);border-color:#bbb}.borde-rojo{border-left-color:#e74c3c}.borde-naranja{border-left-color:#e67e22}.borde-verde{border-left-color:#27ae60}.borde-azul{border-left-color:#3498db}.borde-gris{border-left-color:#aaa}.t-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}.t-num{font-size:11px;font-weight:600;color:var(--gold);letter-spacing:.5px}.t-tipo-badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;margin-left:6px}.tipo-ex{background:#e6f0ff;color:#1a4a90}.tipo-na{background:#f0e6ff;color:#5a1a90}.t-cliente{font-size:15px;font-weight:600;color:#1a1a1a}.t-gestion{font-size:12px;color:#666;margin-top:2px}.badge-estado{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0}.estado-concedido{background:#e6f5ee;color:#1a7a4a}.estado-denegado{background:#fdeaea;color:#c0392b}.estado-tramite{background:#fff5e0;color:#9a5000}.estado-resuelto{background:#eef0f5;color:#4a5568}.estado-requerimiento{background:#fff0e6;color:#c05000}.estado-contestado{background:#e6f0ff;color:#1a4a90}.estado-silencio{background:#fdeaea;color:#8a0000}.t-datos{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px}.t-dato{font-size:12px;color:#888}.t-dato b{color:#1a1a1a;font-weight:500}.barra-wrap{margin:6px 0}.barra-lbl{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:3px}.barra{height:5px;background:#eee;border-radius:3px;overflow:hidden}.barra-fill{height:5px;border-radius:3px;transition:width .3s}.tags{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}.tag{font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid #e0e0e0;color:#666}.tag.si{background:#e6f5ee;color:#1a7a4a;border-color:#a8d5b5}.tag.no{background:#fdeaea;color:#c0392b;border-color:#f0a0a0}.t-bot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.t-vto{font-size:11px;display:flex;align-items:center;gap:4px}.t-vto.rojo{color:#c0392b;font-weight:600}.t-vto.naranja{color:#c05000;font-weight:500}.t-vto.verde{color:#1a7a4a}.t-vto.gris{color:#888}.t-importe{font-size:13px;font-weight:600}.t-importe.pendiente{color:#c0392b}.t-importe.cobrado{color:#1a7a4a}.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;overflow-y:auto;padding:20px}.overlay.visible{display:flex;align-items:flex-start;justify-content:center}.modal{background:white;border-radius:12px;width:100%;max-width:900px;margin:auto;overflow:hidden}.modal-header{background:var(--navy);color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.modal-header h2{font-size:16px;font-weight:600}.modal-close{background:none;border:none;color:white;font-size:22px;cursor:pointer;line-height:1;opacity:.7}.modal-close:hover{opacity:1}.modal-body{padding:20px}.modal-footer{padding:14px 20px;border-top:1px solid #eee;display:flex;justify-content:flex-end;gap:10px;background:#fafafa;flex-wrap:wrap}.seccion{margin-bottom:20px}.seccion-title{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid var(--gold-light);display:flex;align-items:center;gap:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.grid1{display:grid;grid-template-columns:1fr;gap:12px}.campo{display:flex;flex-direction:column;gap:4px}.campo label{font-size:11px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.4px}.campo input,.campo select,.campo textarea{border:1px solid #ddd;border-radius:6px;padding:8px 10px;font-size:13px;background:white;outline:none;transition:border-color .15s}.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--gold)}.campo textarea{resize:vertical;min-height:60px}.btn{padding:9px 20px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:none}.btn-primary{background:var(--navy);color:white}.btn-primary:hover{background:var(--navy2)}.btn-secondary{background:white;color:#555;border:1px solid #ddd}.btn-secondary:hover{background:#f5f5f5}.btn-danger{background:#fdeaea;color:var(--danger);border:1px solid #f0c0c0}.btn-danger:hover{background:#fcd0d0}.btn-gold{background:var(--gold);color:var(--navy)}.btn-gold:hover{background:#dbb85a}.detalle-tabs{display:flex;border-bottom:1px solid #eee;margin-bottom:16px;flex-wrap:wrap}.detalle-tab{padding:8px 16px;font-size:13px;color:#888;cursor:pointer;border-bottom:2px solid transparent}.detalle-tab.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}.timeline{display:flex;flex-direction:column;gap:0}.tl-item{display:flex;gap:12px;padding:10px 0}.tl-dot-wrap{display:flex;flex-direction:column;align-items:center}.tl-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:2px solid #ccc;background:white}.tl-dot.done{background:var(--success);border-color:var(--success)}.tl-dot.urgent{background:var(--danger);border-color:var(--danger)}.tl-line{width:2px;flex:1;background:#eee;min-height:20px}.tl-content{flex:1;padding-bottom:4px}.tl-label{font-size:12px;font-weight:600;color:#555}.tl-fecha{font-size:13px;color:#1a1a1a}.factura-resumen{background:#f9f9f9;border:1px solid #eee;border-radius:8px;padding:14px;margin-bottom:14px}.factura-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px}.factura-row.total{border-top:1px solid #ddd;margin-top:6px;padding-top:10px;font-weight:700;font-size:15px}.factura-row.pendiente{color:var(--danger)}.checklist{display:flex;flex-direction:column;gap:6px}.check-item{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}.check-item input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--navy)}.check-item.done{color:#888;text-decoration:line-through}.pagos-lista{display:flex;flex-direction:column;gap:8px}.pago-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center;background:#f9f9f9;border:1px solid #eee;border-radius:6px;padding:8px 10px}.btn-add-pago{background:none;border:1px dashed #bbb;border-radius:6px;padding:8px;color:#888;cursor:pointer;font-size:13px;text-align:center;width:100%;margin-top:6px}.btn-rm{background:none;border:none;color:#ccc;cursor:pointer;font-size:16px;padding:0 4px}.empty{text-align:center;padding:60px 20px;color:#aaa}.doc-panel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.doc-card{border:1px solid #eee;background:#fafafa;border-radius:10px;padding:14px}.doc-card h4{font-size:14px;color:var(--navy);margin-bottom:6px}.doc-card p{font-size:12px;color:#666;margin-bottom:10px}.notice{padding:10px 12px;background:#fff9ee;border:1px solid #f0d890;color:#7a5500;border-radius:8px;font-size:12px;margin-bottom:12px}@media(max-width:700px){.grid2,.grid3,.doc-panel{grid-template-columns:1fr}.stats-bar{grid-template-columns:repeat(2,1fr)}.pago-row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="header"><div class="header-left"><div class="logo">GJG</div><div><div class="header-title">Gestoría Justo Guevara</div><div class="header-sub">Extranjería · Nacionalidad · Colegiado nº 493</div></div></div><button class="btn-nuevo" onclick="abrirNuevo()">+ Nuevo expediente</button></div>
<div class="tabs-bar"><div class="tab active" onclick="setTab('todos',this)">Todos</div><div class="tab" onclick="setTab('EX',this)">🌍 Extranjería</div><div class="tab" onclick="setTab('NA',this)">🇪🇸 Nacionalidad</div></div>
<div class="stats-bar" id="statsBar"></div><div class="alertas-bar" id="alertasBar" style="display:none"></div>
<div class="toolbar"><input class="search-box" id="buscador" placeholder="Buscar cliente, NIE, nº expediente, gestión..." oninput="renderLista()"><button class="filtro on" onclick="setFiltro('todos',this)">Todos</button><button class="filtro" onclick="setFiltro('tramite',this)">En trámite</button><button class="filtro" onclick="setFiltro('vencimientos',this)">⚠ Vencimientos</button><button class="filtro" onclick="setFiltro('pendiente',this)">Pendiente cobro</button><button class="filtro" onclick="setFiltro('cerrados',this)">Cerrados</button></div>
<div class="lista" id="listaExp"></div>
<div class="overlay" id="overlay"><div class="modal"><div class="modal-header"><h2 id="modalTitle">Nuevo expediente</h2><button class="modal-close" onclick="cerrarModal()">×</button></div><div class="modal-body" id="modalBody"></div><div class="modal-footer" id="modalFooter"></div></div></div>
<script>
const CONFIG_URL='https://gestoriajustoguevara-art.github.io/consola/config.json';let APPS_SCRIPT_URL='',URL_MAESTRO='',URL_VTO_EXT='';async function cargarConfig(){try{const res=await fetch(CONFIG_URL);const cfg=await res.json();APPS_SCRIPT_URL=cfg.extranjeria.scriptUrl;URL_MAESTRO=cfg.clientesMaestro?.scriptUrl||'';URL_VTO_EXT=cfg.vencimientos?.scriptUrl||'';console.log('✅ Config central cargada')}catch(e){console.error('❌ Error cargando config central:',e)}}
let expedientes=JSON.parse(localStorage.getItem('extExpedientes')||'[]'),tabActual='todos',filtroActual='todos',expEditando=null,pagosTemp=[];if(expedientes.length===0){expedientes=getDatosIniciales();guardarLocal()}
function hoy(){return new Date()}function fechaHoy(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function fD(d){if(!d)return'—';try{const p=String(d).split('T')[0].split('-');if(p.length===3&&p[0].length===4)return p[2]+'/'+p[1]+'/'+p[0].slice(-2)}catch(e){}return d}function sumarDias(fecha,dias){if(!fecha)return null;const d=new Date(fecha);d.setDate(d.getDate()+dias);return d.toISOString().split('T')[0]}function sumarMeses(fecha,meses){if(!fecha)return null;const d=new Date(fecha);d.setMonth(d.getMonth()+meses);return d.toISOString().split('T')[0]}function sumarAnios(fecha,anios){if(!fecha)return null;const d=new Date(fecha);d.setFullYear(d.getFullYear()+anios);return d.toISOString().split('T')[0]}function diasRestantes(fecha){if(!fecha)return null;return Math.ceil((new Date(fecha)-new Date())/86400000)}function round2(n){const x=Number(n)||0;return Math.round((x+Number.EPSILON)*100)/100}function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function nextNumExp(tipo){const anio=new Date().getFullYear().toString().slice(-2),prefijo=tipo+anio+'/';const nums=expedientes.filter(e=>e.numExp&&e.numExp.startsWith(prefijo)).map(e=>parseInt(e.numExp.replace(prefijo,''))||0);return prefijo+String((nums.length?Math.max(...nums):0)+1).padStart(3,'0')}
function calcFechas(exp){const c={};if(exp.tipo==='EX'){c.limPagoTasas=exp.fechaReqTasas?sumarDias(exp.fechaReqTasas,10):null;c.limRespReq=exp.fechaRecepReq?sumarDias(exp.fechaRecepReq,10):null;c.silencioAdm=exp.fechaPresentacion?sumarMeses(exp.fechaPresentacion,3):null}else{c.limRespReq=exp.fechaRecepReq?sumarMeses(exp.fechaRecepReq,3):null;c.silencioAdm=exp.fechaPresentacion?sumarAnios(exp.fechaPresentacion,2):null}return c}function calcFinanciero(exp){const cobrado=(exp.pagos||[]).reduce((s,p)=>s+(round2(p.importe)||0),0),total=round2(exp.importeTotal)||0;return{cobrado:round2(cobrado),total,pendiente:round2(total-cobrado)}}
function getBorde(exp){const fc=calcFechas(exp),h=fechaHoy(),cerr=['CONCEDIDO','DENEGADO','RESUELTO','ARCHIVADO'];if(cerr.includes(exp.estado))return'borde-verde';if(fc.limPagoTasas&&fc.limPagoTasas<=h&&!exp.fechaPagoTasas)return'borde-rojo';if(fc.limRespReq&&fc.limRespReq<=h&&!exp.fechaPresReq)return'borde-rojo';if(fc.limRespReq&&diasRestantes(fc.limRespReq)<=5&&!exp.fechaPresReq)return'borde-rojo';if(fc.limRespReq&&diasRestantes(fc.limRespReq)<=15&&!exp.fechaPresReq)return'borde-naranja';if(fc.limPagoTasas&&diasRestantes(fc.limPagoTasas)<=5&&!exp.fechaPagoTasas)return'borde-naranja';if(!exp.fechaPresentacion)return'borde-azul';return'borde-gris'}
function filtrarPorTab(){return tabActual==='todos'?expedientes:expedientes.filter(e=>e.tipo===tabActual)}function filtrarLista(){let lista=filtrarPorTab();const q=(document.getElementById('buscador')?.value||'').toLowerCase();if(q)lista=lista.filter(e=>(e.cliente||'').toLowerCase().includes(q)||(e.numExp||'').toLowerCase().includes(q)||(e.nie||'').toLowerCase().includes(q)||(e.gestion||'').toLowerCase().includes(q)||(e.numExtj||'').toLowerCase().includes(q));if(filtroActual==='tramite')lista=lista.filter(e=>!['CONCEDIDO','DENEGADO','RESUELTO','ARCHIVADO'].includes(e.estado));if(filtroActual==='cerrados')lista=lista.filter(e=>['CONCEDIDO','DENEGADO','RESUELTO','ARCHIVADO'].includes(e.estado));if(filtroActual==='pendiente')lista=lista.filter(e=>calcFinanciero(e).pendiente>0);if(filtroActual==='vencimientos')lista=lista.filter(e=>{const fc=calcFechas(e);return(fc.limPagoTasas&&!e.fechaPagoTasas&&diasRestantes(fc.limPagoTasas)<=15)||(fc.limRespReq&&!e.fechaPresReq&&diasRestantes(fc.limRespReq)<=15)});return lista}
function renderStats(){const lista=filtrarPorTab(),total=lista.length,con=lista.filter(e=>e.estado==='CONCEDIDO').length,tra=lista.filter(e=>!['CONCEDIDO','DENEGADO','RESUELTO','ARCHIVADO'].includes(e.estado)).length;let venc=0;lista.forEach(e=>{const fc=calcFechas(e);if(fc.limPagoTasas&&fc.limPagoTasas<=fechaHoy()&&!e.fechaPagoTasas)venc++;else if(fc.limRespReq&&fc.limRespReq<=fechaHoy()&&!e.fechaPresReq)venc++;else if(fc.limRespReq&&diasRestantes(fc.limRespReq)<=7&&!e.fechaPresReq)venc++});const pend=lista.reduce((s,e)=>s+Math.max(calcFinanciero(e).pendiente,0),0);document.getElementById('statsBar').innerHTML=`<div class="stat"><div class="stat-num">${total}</div><div class="stat-lbl">Total</div></div><div class="stat"><div class="stat-num ok">${con}</div><div class="stat-lbl">Concedidos</div></div><div class="stat"><div class="stat-num warn">${tra}</div><div class="stat-lbl">En trámite</div></div><div class="stat"><div class="stat-num alerta">${venc}</div><div class="stat-lbl">⚠ Vencimientos</div></div><div class="stat"><div class="stat-num alerta">${round2(pend).toLocaleString('es-ES',{minimumFractionDigits:0})}€</div><div class="stat-lbl">Pendiente cobro</div></div>`}
function renderAlertas(){const alertas=[];filtrarPorTab().forEach(e=>{const fc=calcFechas(e);if(fc.limPagoTasas&&!e.fechaPagoTasas){const d=diasRestantes(fc.limPagoTasas);if(d<=10)alertas.push({tipo:d<=0?'rojo':'naranja',texto:`<b>${esc(e.cliente)}</b> (${esc(e.numExp)}) — Límite pago tasas: ${fD(fc.limPagoTasas)} ${d<=0?'— VENCIDO':'— '+d+' días'}`})}if(fc.limRespReq&&!e.fechaPresReq){const d=diasRestantes(fc.limRespReq);if(d<=15)alertas.push({tipo:d<=0?'rojo':'naranja',texto:`<b>${esc(e.cliente)}</b> (${esc(e.numExp)}) — Límite respuesta req.: ${fD(fc.limRespReq)} ${d<=0?'— VENCIDO':'— '+d+' días'}`})}});const bar=document.getElementById('alertasBar');if(!alertas.length){bar.style.display='none';return}bar.style.display='flex';bar.innerHTML=alertas.map(a=>`<div class="alerta-item"><div class="dot ${a.tipo}"></div><span>${a.texto}</span></div>`).join('')}
function renderLista(){renderStats();renderAlertas();const lista=filtrarLista(),cont=document.getElementById('listaExp');if(!lista.length){cont.innerHTML='<div class="empty"><div style="font-size:40px">📂</div><h3>No hay expedientes</h3><p>Pulsa Nuevo expediente para empezar</p></div>';return}cont.innerHTML=lista.map(renderTarjeta).join('')}function renderTarjeta(e){const fc=calcFechas(e),fin=calcFinanciero(e),borde=getBorde(e),badge=e.tipo==='EX'?'<span class="t-tipo-badge tipo-ex">Extranjería</span>':'<span class="t-tipo-badge tipo-na">Nacionalidad</span>';const estadoClass={'CONCEDIDO':'estado-concedido','DENEGADO':'estado-denegado','EN TRÁMITE':'estado-tramite','REQUERIMIENTO':'estado-requerimiento','CONTESTADO REQUERIMIENTO':'estado-contestado','RESUELTO':'estado-resuelto','SILENCIO ADM.':'estado-silencio','ARCHIVADO':'estado-resuelto'}[e.estado]||'estado-tramite';let vto='';if(e.tipo==='EX'&&fc.limPagoTasas&&!e.fechaPagoTasas){const d=diasRestantes(fc.limPagoTasas);vto=`<div class="t-vto ${d<=5?'rojo':'naranja'}">⚠ Lím. tasas: ${fD(fc.limPagoTasas)}${d<=0?' VENCIDO':' ('+d+'d)'}</div>`}else if(fc.limRespReq&&!e.fechaPresReq){const d=diasRestantes(fc.limRespReq);vto=`<div class="t-vto ${d<=7?'rojo':d<=15?'naranja':'gris'}">⚠ Lím. req: ${fD(fc.limRespReq)}${d<=0?' VENCIDO':' ('+d+'d)'}</div>`}else if(fc.silencioAdm)vto=`<div class="t-vto gris">Silencio adm: ${fD(fc.silencioAdm)}</div>`;const impClass=fin.pendiente>0?'pendiente':'cobrado',impTexto=fin.pendiente>0?`Pendiente: ${fin.pendiente.toLocaleString('es-ES')}€`:fin.total>0?'Cobrado ✓':'';const pasos=e.tipo==='EX'?[!!e.fechaCreacion,!!e.fechaPresentacion,!!e.fechaPagoTasas,!!e.fechaPresReq||!e.fechaRecepReq,['CONCEDIDO','DENEGADO','RESUELTO'].includes(e.estado)]:[!!e.fechaCreacion,!!e.fechaPresentacion,!!e.fechaPresReq||!e.fechaRecepReq,['CONCEDIDO','DENEGADO','RESUELTO'].includes(e.estado)];const pct=Math.round(pasos.filter(Boolean).length/pasos.length*100),bar=e.estado==='CONCEDIDO'?'#27ae60':e.estado==='DENEGADO'?'#e74c3c':e.estado==='REQUERIMIENTO'?'#e67e22':'#3498db';return `<div class="tarjeta ${borde}" onclick="abrirDetalle('${e.id}')"><div class="t-top"><div><div><span class="t-num">${esc(e.numExp)}</span>${badge}</div><div class="t-cliente">${esc(e.cliente)}</div><div class="t-gestion">${esc(e.gestion)}</div></div><div class="badge-estado ${estadoClass}">${esc(e.estado||'EN TRÁMITE')}</div></div><div class="t-datos">${e.nie?`<div class="t-dato">NIE/Pas: <b>${esc(e.nie)}</b></div>`:''}${e.numExtj?`<div class="t-dato">Nº Extj: <b>${esc(e.numExtj)}</b></div>`:''}</div><div class="barra-wrap"><div class="barra-lbl"><span>Progreso</span><span>${pct}%</span></div><div class="barra"><div class="barra-fill" style="width:${pct}%;background:${bar}"></div></div></div><div class="tags"><span class="tag ${e.docCompleta==='SI'?'si':'no'}">${e.docCompleta==='SI'?'Doc. completa':'Doc. incompleta'}</span><span class="tag ${e.fechaPresentacion?'si':'no'}">${e.fechaPresentacion?'Presentado':'Sin presentar'}</span>${e.tipo==='EX'?`<span class="tag ${e.tasasPagadas==='SI'?'si':'no'}">${e.tasasPagadas==='SI'?'Tasas pagadas':'Tasas pendientes'}</span>`:''}</div><div class="t-bot">${vto}<div class="t-importe ${impClass}">${impTexto}</div></div></div>`}
function abrirNuevo(){expEditando=null;document.getElementById('modalTitle').textContent='Nuevo expediente';document.getElementById('modalBody').innerHTML=renderFormulario(null);document.getElementById('modalFooter').innerHTML='<button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button><button class="btn btn-primary" onclick="guardarExp()">Guardar expediente</button>';iniciarFormulario(null);document.getElementById('overlay').classList.add('visible')}function abrirDetalle(id){const exp=expedientes.find(e=>e.id===id);if(!exp)return;expEditando=id;document.getElementById('modalTitle').textContent=exp.numExp+' — '+exp.cliente;document.getElementById('modalBody').innerHTML=renderDetalle(exp);document.getElementById('modalFooter').innerHTML=`<button class="btn btn-danger" onclick="eliminarExp('${id}')">Eliminar</button><button class="btn btn-secondary" onclick="cerrarModal()">Cerrar</button><button class="btn btn-primary" onclick="editarExp('${id}')">Editar</button>`;document.getElementById('overlay').classList.add('visible')}function editarExp(id){const exp=expedientes.find(e=>e.id===id);if(!exp)return;expEditando=id;document.getElementById('modalTitle').textContent='Editar — '+exp.numExp;document.getElementById('modalBody').innerHTML=renderFormulario(exp);document.getElementById('modalFooter').innerHTML=`<button class="btn btn-secondary" onclick="abrirDetalle('${id}')">Cancelar</button><button class="btn btn-primary" onclick="guardarExp()">Guardar cambios</button>`;iniciarFormulario(exp)}
function renderDetalle(exp){const fc=calcFechas(exp),fin=calcFinanciero(exp);return `<div style="margin-bottom:12px"><span class="badge-estado estado-tramite">${exp.tipo==='EX'?'🌍 Extranjería':'🇪🇸 Nacionalidad'}</span> <span style="font-size:13px;color:#666">${esc(exp.gestion)}</span>${exp.nie?`<div style="margin-top:6px;font-size:13px;color:#555">NIE/Pasaporte: <b>${esc(exp.nie)}</b></div>`:''}${exp.observaciones?`<div style="margin-top:8px;font-size:13px;color:#444;background:#f9f9f9;border-radius:6px;padding:8px 12px">${esc(exp.observaciones)}</div>`:''}</div><div class="detalle-tabs"><div class="detalle-tab active" onclick="switchDetalleTab(this,'tab-timeline')">Cronología</div><div class="detalle-tab" onclick="switchDetalleTab(this,'tab-factura')">Facturación</div><div class="detalle-tab" onclick="switchDetalleTab(this,'tab-checklist')">Documentación</div><div class="detalle-tab" onclick="switchDetalleTab(this,'tab-documentos')">Generar PDFs</div></div><div id="tab-timeline">${renderTimeline(exp,fc)}</div><div id="tab-factura" style="display:none">${renderFactura(exp,fin)}</div><div id="tab-checklist" style="display:none">${renderChecklist(exp)}</div><div id="tab-documentos" style="display:none">${renderDocs(exp)}</div>`}
function renderTimeline(e,fc){const pasos=e.tipo==='EX'?[['Apertura expediente',e.fechaCreacion,!!e.fechaCreacion],['Documentación completa',null,e.docCompleta==='SI'],['Presentación solicitud',e.fechaPresentacion,!!e.fechaPresentacion],['Límite pago tasas',fc.limPagoTasas,!!e.fechaPagoTasas],['Pago tasas',e.fechaPagoTasas,!!e.fechaPagoTasas],['Recepción requerimiento',e.fechaRecepReq,!!e.fechaRecepReq],['Límite respuesta requerimiento',fc.limRespReq,!!e.fechaPresReq],['Presentación requerimiento',e.fechaPresReq,!!e.fechaPresReq],['Silencio administrativo',fc.silencioAdm,false],['Resolución',e.fechaRespuesta,!!e.fechaRespuesta]]:[['Apertura expediente',e.fechaCreacion,!!e.fechaCreacion],['Presentación solicitud',e.fechaPresentacion,!!e.fechaPresentacion],['Recepción requerimiento',e.fechaRecepReq,!!e.fechaRecepReq],['Límite respuesta requerimiento',fc.limRespReq,!!e.fechaPresReq],['Resolución',e.fechaRespuesta,!!e.fechaRespuesta]];return `<div class="timeline">${pasos.map((p,i)=>`<div class="tl-item"><div class="tl-dot-wrap"><div class="tl-dot ${p[2]?'done':''}"></div>${i<pasos.length-1?'<div class="tl-line"></div>':''}</div><div class="tl-content"><div class="tl-label">${p[0]}</div><div class="tl-fecha">${p[1]?fD(p[1]):'—'}</div></div></div>`).join('')}</div>`}
function renderFactura(exp,fin){const pagos=(exp.pagos||[]).map(p=>`<div class="factura-row"><span>${p.fecha?fD(p.fecha):'—'}${p.recibo?' · Recibo '+esc(p.recibo):''}</span><span style="font-weight:600">${round2(p.importe).toLocaleString('es-ES',{minimumFractionDigits:2})}€</span></div>`).join('')||'<div style="color:#aaa;font-size:13px">Sin pagos registrados</div>';return `<div class="factura-resumen"><div class="factura-row"><span>Importe total servicio</span><span style="font-weight:600">${round2(exp.importeTotal).toLocaleString('es-ES',{minimumFractionDigits:2})}€</span></div><div style="border-top:1px solid #eee;margin:6px 0;padding-top:8px;font-size:11px;font-weight:700;color:#888;text-transform:uppercase">Pagos recibidos</div>${pagos}<div class="factura-row total ${fin.pendiente>0?'pendiente':''}"><span>${fin.pendiente>0?'Pendiente de cobro':'✓ Cobrado total'}</span><span>${fin.pendiente>0?fin.pendiente.toLocaleString('es-ES',{minimumFractionDigits:2})+'€':fin.cobrado.toLocaleString('es-ES',{minimumFractionDigits:2})+'€'}</span></div></div>`}
function renderChecklist(exp){return `<div class="checklist" id="checklistInteractivo">${getChecklist(exp.tipo,exp.gestion).map(item=>{const marcado=(exp.checklist||[]).includes(item);return `<label class="check-item ${marcado?'done':''}"><input type="checkbox" ${marcado?'checked':''} onchange="toggleCheckItem('${exp.id}','${item.replace(/'/g,"\\'")}',this.checked)"> ${esc(item)}</label>`}).join('')}</div>`}
function renderDocs(exp){const isEX02=(exp.gestion||'').toUpperCase().includes('REAGRUP');return `<div class="notice">Antes de generar EX-02, entra en Editar y completa el bloque específico “Datos EX-02”. El documento se genera en Drive desde Apps Script.</div><div class="doc-panel"><div class="doc-card"><h4>EX-02 Reagrupación</h4><p>${isEX02?'Disponible para este expediente.':'Solo recomendable para reagrupación familiar.'}</p><button class="btn btn-gold" onclick="generarDocumentoActual('EX02')">Generar EX-02</button></div><div class="doc-card"><h4>EX-32</h4><p>Regularización extraordinaria / arraigo extraordinario.</p><button class="btn btn-gold" onclick="generarDocumentoActual('EX32')">Generar EX-32</button></div><div class="doc-card"><h4>Mandato Mercurio/SARA</h4><p>Mandato profesional con datos del cliente y despacho.</p><button class="btn btn-primary" onclick="generarDocumentoActual('MANDATO')">Generar Mandato</button></div></div><div id="doc-status" style="margin-top:12px;font-size:13px"></div>`}
function switchDetalleTab(el,tabId){document.querySelectorAll('.detalle-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');['tab-timeline','tab-factura','tab-checklist','tab-documentos'].forEach(id=>{const t=document.getElementById(id);if(t)t.style.display=id===tabId?'block':'none'})}
async function generarDocumentoActual(tipoDoc){const exp=expedientes.find(e=>e.id===expEditando),st=document.getElementById('doc-status');if(!exp){alert('No hay expediente seleccionado');return}if(!APPS_SCRIPT_URL){alert('No está cargada la URL de Apps Script');return}if(st)st.innerHTML='⏳ Generando documento...';try{const res=await fetch(APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'generarDocumento',tipoDocumento:tipoDoc,datos:exp})});const out=await res.json();if(out.ok&&out.pdfUrl){if(st)st.innerHTML=`✅ Generado: <a href="${out.pdfUrl}" target="_blank">Abrir PDF</a> · <a href="${out.docUrl}" target="_blank">Editar DOC</a>`;window.open(out.pdfUrl,'_blank')}else{if(st)st.textContent='❌ Error: '+(out.error||'desconocido')}}catch(e){if(st)st.textContent='❌ Error generando documento: '+e.message}}
function renderFormulario(exp){const e=exp||{},tipo=e.tipo||'EX',ex02=e.ex02||{},rg=ex02.reagrupante||{},rf=ex02.reagrupado||{};return `<div class="seccion"><div class="seccion-title">📋 Tipo y datos básicos</div><div class="grid2"><div class="campo"><label>Tipo expediente *</label><select id="f_tipo" onchange="onTipoChange()"><option value="EX" ${tipo==='EX'?'selected':''}>🌍 Extranjería</option><option value="NA" ${tipo==='NA'?'selected':''}>🇪🇸 Nacionalidad</option></select></div><div class="campo"><label>Nº Expediente</label><input id="f_numExp" value="${esc(e.numExp||'')}" placeholder="Auto"></div></div><div class="grid1" style="margin-top:10px"><div class="campo"><label>Tipo gestión *</label><select id="f_gestion" onchange="onGestionChange()"><option value="">— Seleccionar —</option>${getListaGestiones(tipo).map(g=>`<option value="${g}" ${e.gestion===g?'selected':''}>${g}</option>`).join('')}<option value="OTRO" ${e.gestion&&!getListaGestiones(tipo).includes(e.gestion)?'selected':''}>Otro</option></select></div></div><div class="grid1" id="campo_gestion_libre" style="display:${e.gestion&&!getListaGestiones(tipo).includes(e.gestion)?'grid':'none'};margin-top:8px"><div class="campo"><label>Gestión libre</label><input id="f_gestion_libre" value="${esc(e.gestion&&!getListaGestiones(tipo).includes(e.gestion)?e.gestion:'')}"></div></div></div><div class="seccion"><div class="seccion-title">👤 Cliente</div><div class="grid2"><div class="campo"><label>Cliente *</label><input id="f_cliente" value="${esc(e.cliente||'')}" placeholder="NOMBRE APELLIDO1 APELLIDO2"></div><div class="campo"><label>NIE / Pasaporte</label><input id="f_nie" value="${esc(e.nie||'')}" style="text-transform:uppercase"><button type="button" onclick="rellenarDesdeMaestroEX()" style="margin-top:4px;padding:4px 10px;border:1px solid #ccc;border-radius:5px;cursor:pointer;font-size:11px;background:#f9f9f9">🔍 Buscar en ClientesMAESTRO</button><span id="maestro-status-ex" style="font-size:11px;margin-left:6px"></span></div></div><div class="grid2" style="margin-top:10px"><div class="campo"><label>Otros clientes / familiares</label><input id="f_otros" value="${esc(e.otrosClientes||'')}"></div><div class="campo"><label>Nº Expediente Extranjería</label><input id="f_numExtj" value="${esc(e.numExtj||'')}"></div></div></div><div id="bloque_ex02" style="display:${(e.gestion||'').toUpperCase().includes('REAGRUP')?'block':'none'}">${renderBloqueEX02(ex02,rg,rf)}</div><div class="seccion"><div class="seccion-title">📅 Fechas</div><div class="grid3"><div class="campo"><label>Fecha creación</label><input type="date" id="f_fechaCreacion" value="${e.fechaCreacion||fechaHoy()}"></div><div class="campo"><label>Documentación completa</label><select id="f_docCompleta"><option value="NO" ${e.docCompleta!=='SI'?'selected':''}>No</option><option value="SI" ${e.docCompleta==='SI'?'selected':''}>Sí</option></select></div><div class="campo"><label>Fecha presentación</label><input type="date" id="f_fechaPresentacion" value="${e.fechaPresentacion||''}"></div></div><div id="bloque_fechas_ex" style="display:${tipo==='EX'?'block':'none'};margin-top:12px"><div class="grid3"><div class="campo"><label>Total tasas</label><input type="number" id="f_totalTasas" value="${e.totalTasas||''}" step="0.01"></div><div class="campo"><label>Tasas pagadas</label><select id="f_tasasPagadas"><option value="NO" ${e.tasasPagadas!=='SI'?'selected':''}>No</option><option value="SI" ${e.tasasPagadas==='SI'?'selected':''}>Sí</option></select></div><div class="campo"><label>Tasas presentadas</label><select id="f_tasasPresentadas"><option value="NO" ${e.tasasPresentadas!=='SI'?'selected':''}>No</option><option value="SI" ${e.tasasPresentadas==='SI'?'selected':''}>Sí</option></select></div></div><div class="grid3" style="margin-top:10px"><div class="campo"><label>Fecha req. tasas</label><input type="date" id="f_fechaReqTasas" value="${e.fechaReqTasas||''}"></div><div class="campo"><label>Fecha pago tasas</label><input type="date" id="f_fechaPagoTasas" value="${e.fechaPagoTasas||''}"></div><div class="campo"><label>Fecha presentación tasas</label><input type="date" id="f_fechaPresTasas" value="${e.fechaPresTasas||''}"></div></div></div><div class="grid3" style="margin-top:12px"><div class="campo"><label>Fecha recepción requerimiento</label><input type="date" id="f_fechaRecepReq" value="${e.fechaRecepReq||''}"></div><div class="campo"><label>Fecha presentación requerimiento</label><input type="date" id="f_fechaPresReq" value="${e.fechaPresReq||''}"></div><div class="campo"><label>Fecha respuesta / resolución</label><input type="date" id="f_fechaRespuesta" value="${e.fechaRespuesta||''}"></div></div></div><div class="seccion"><div class="seccion-title">📊 Estado y facturación</div><div class="grid3"><div class="campo"><label>Estado</label><select id="f_estado">${['EN TRÁMITE','REQUERIMIENTO','CONTESTADO REQUERIMIENTO','CONCEDIDO','DENEGADO','SILENCIO ADM.','RESUELTO','ARCHIVADO'].map(s=>`<option value="${s}" ${e.estado===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="campo"><label>Importe servicio</label><input type="number" id="f_importeTotal" value="${e.importeTotal||''}" step="0.01"></div><div class="campo"><label>Estado factura</label><select id="f_estadoFactura"><option value="EN TRÁMITE" ${e.estadoFactura==='EN TRÁMITE'||!e.estadoFactura?'selected':''}>En trámite</option><option value="LISTO" ${e.estadoFactura==='LISTO'?'selected':''}>Listo</option><option value="FACTURADO" ${e.estadoFactura==='FACTURADO'?'selected':''}>Facturado</option><option value="nf" ${e.estadoFactura==='nf'?'selected':''}>No facturar</option></select></div></div><div style="margin-top:14px"><div style="font-size:12px;font-weight:700;color:#555;margin-bottom:8px">Pagos recibidos</div><div class="pagos-lista" id="pagosLista"></div><button class="btn-add-pago" onclick="addPago()">+ Añadir pago</button></div></div><div class="seccion"><div class="seccion-title">📝 Observaciones</div><div class="campo"><textarea id="f_observaciones">${esc(e.observaciones||'')}</textarea></div></div>`}

function iniciarFormulario(exp){pagosTemp=exp?JSON.parse(JSON.stringify(exp.pagos||[])):[];renderPagosForm()}function renderPagosForm(){const cont=document.getElementById('pagosLista');if(!cont)return;if(!pagosTemp.length){cont.innerHTML='<div style="color:#aaa;font-size:13px;padding:4px 0">Sin pagos aún</div>';return}cont.innerHTML=pagosTemp.map((p,i)=>`<div class="pago-row"><input type="date" value="${p.fecha||''}" onchange="pagosTemp[${i}].fecha=this.value"><input type="number" value="${p.importe||''}" onchange="pagosTemp[${i}].importe=parseFloat(this.value)||0" placeholder="Importe €" step="0.01"><input type="text" value="${esc(p.recibo||'')}" onchange="pagosTemp[${i}].recibo=this.value" placeholder="Nº recibo"><button class="btn-rm" onclick="rmPago(${i})">×</button></div>`).join('')}function addPago(){pagosTemp.push({fecha:fechaHoy(),importe:0,recibo:''});renderPagosForm()}function rmPago(i){pagosTemp.splice(i,1);renderPagosForm()}
function getVal(id){return document.getElementById(id)?.value||''}function getEX02FromForm(){const obj={tipoAutorizacion:getVal('ex02_tipoAutorizacion'),parentesco:getVal('ex02_parentesco').toUpperCase(),dehu:getVal('ex02_dehu')==='SI',hijosEscolarizados:getVal('ex02_hijos'),otrasSolicitudes:getVal('ex02_otras'),provinciaPresentacion:getVal('ex02_provincia').toUpperCase(),reagrupante:{},reagrupado:{}};['nombre','apellido1','apellido2','pasaporte','nie','sexo','fechaNacimiento','lugarNacimiento','paisNacimiento','nacionalidad','estadoCivil','autorizacion','padre','madre','domicilio','numero','piso','localidad','cp','provincia','telefono','email'].forEach(k=>obj.reagrupante[k]=getVal('rg_'+k).toUpperCase());['nombre','apellido1','apellido2','pasaporte','nie','sexo','estadoCivil','fechaNacimiento','paisNacimiento','nacionalidad','padre','madre','domicilio','numero','piso','localidad','cp','provincia'].forEach(k=>obj.reagrupado[k]=getVal('rf_'+k).toUpperCase());return obj}
function guardarExp(){const tipo=getVal('f_tipo')||'EX',gestionSel=getVal('f_gestion'),gestion=gestionSel==='OTRO'?getVal('f_gestion_libre'):gestionSel,cliente=getVal('f_cliente').trim().toUpperCase();if(!cliente){alert('El nombre del cliente es obligatorio');return}if(!gestion){alert('El tipo de gestión es obligatorio');return}const exp={id:expEditando||('exp_'+Date.now()),tipo,numExp:getVal('f_numExp').trim()||nextNumExp(tipo),gestion,cliente,nie:getVal('f_nie').toUpperCase(),otrosClientes:getVal('f_otros'),numExtj:getVal('f_numExtj'),fechaCreacion:getVal('f_fechaCreacion'),docCompleta:getVal('f_docCompleta'),fechaPresentacion:getVal('f_fechaPresentacion'),fechaRecepReq:getVal('f_fechaRecepReq'),fechaPresReq:getVal('f_fechaPresReq'),fechaRespuesta:getVal('f_fechaRespuesta'),estado:getVal('f_estado')||'EN TRÁMITE',importeTotal:parseFloat(getVal('f_importeTotal'))||0,estadoFactura:getVal('f_estadoFactura')||'EN TRÁMITE',observaciones:getVal('f_observaciones'),pagos:pagosTemp,checklist:expEditando?(expedientes.find(e=>e.id===expEditando)?.checklist||[]):[]};if(tipo==='EX'){exp.totalTasas=parseFloat(getVal('f_totalTasas'))||0;exp.tasasPagadas=getVal('f_tasasPagadas')||'NO';exp.tasasPresentadas=getVal('f_tasasPresentadas')||'NO';exp.fechaReqTasas=getVal('f_fechaReqTasas');exp.fechaPagoTasas=getVal('f_fechaPagoTasas');exp.fechaPresTasas=getVal('f_fechaPresTasas')}if((gestion||'').toUpperCase().includes('REAGRUP'))exp.ex02=getEX02FromForm();if(expEditando){const idx=expedientes.findIndex(e=>e.id===expEditando);if(idx>=0)expedientes[idx]=exp}else expedientes.push(exp);guardarLocal();sincronizarExpediente(exp);cerrarModal();renderLista()}
function onTipoChange(){const tipo=getVal('f_tipo'),bloque=document.getElementById('bloque_fechas_ex');if(bloque)bloque.style.display=tipo==='EX'?'block':'none';const sel=document.getElementById('f_gestion');if(sel)sel.innerHTML='<option value="">— Seleccionar —</option>'+getListaGestiones(tipo).map(g=>`<option value="${g}">${g}</option>`).join('')+'<option value="OTRO">Otro</option>';const numEl=document.getElementById('f_numExp');if(numEl&&!numEl.value)numEl.value=nextNumExp(tipo)}function onGestionChange(){const v=getVal('f_gestion'),libre=document.getElementById('campo_gestion_libre'),bloque=document.getElementById('bloque_ex02');if(libre)libre.style.display=v==='OTRO'?'grid':'none';if(bloque)bloque.style.display=(v||'').toUpperCase().includes('REAGRUP')?'block':'none'}
function eliminarExp(id){if(!confirm('¿Eliminar este expediente?'))return;expedientes=expedientes.filter(e=>e.id!==id);guardarLocal();sincronizarSheets();cerrarModal();renderLista()}function guardarLocal(){localStorage.setItem('extExpedientes',JSON.stringify(expedientes))}function sincronizarExpediente(exp){if(!APPS_SCRIPT_URL)return;fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'upsertExpediente',hoja:'ExtranjeriaExp',expediente:exp})})}function sincronizarSheets(){if(!APPS_SCRIPT_URL)return;const headers=['numExp','tipo','gestion','cliente','nie','otrosClientes','numExtj','esMenor','titularFactura','dniTitular','fechaCreacion','docCompleta','fechaPresentacion','totalTasas','tasasPagadas','tasasPresentadas','fechaReqTasas','fechaPagoTasas','fechaPresTasas','fechaRecepReq','fechaPresReq','fechaRespuesta','estado','traduccion','importeTotal','estadoFactura','numFactura','pagos_json','checklist_json','observaciones','ex02_json'];const datos=[headers,...expedientes.map(e=>[e.numExp,e.tipo,e.gestion,e.cliente,e.nie,e.otrosClientes,e.numExtj,e.esMenor?'SI':'NO',e.titularFactura,e.dniTitular,e.fechaCreacion,e.docCompleta,e.fechaPresentacion,e.totalTasas||0,e.tasasPagadas||'',e.tasasPresentadas||'',e.fechaReqTasas||'',e.fechaPagoTasas||'',e.fechaPresTasas||'',e.fechaRecepReq,e.fechaPresReq,e.fechaRespuesta,e.estado,e.traduccion,e.importeTotal,e.estadoFactura,e.numFactura||'',JSON.stringify(e.pagos||[]),JSON.stringify(e.checklist||[]),e.observaciones,JSON.stringify(e.ex02||{})])];fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'escribir',hoja:'ExtranjeriaExp',datos})})}
function cargarDeSheets(){if(!APPS_SCRIPT_URL)return;fetch(APPS_SCRIPT_URL+'?action=leer&hoja=ExtranjeriaExp').then(r=>r.json()).then(d=>{if(d&&d.length>1){const[cab,...filas]=d;const remoto=filas.filter(f=>f[0]).map(f=>{const o={};cab.forEach((c,i)=>o[c]=f[i]);o.pagos=JSON.parse(o.pagos_json||'[]');o.checklist=JSON.parse(o.checklist_json||'[]');o.ex02=JSON.parse(o.ex02_json||'{}');o.id=o.id||('exp_'+o.numExp);o.esMenor=o.esMenor==='SI';o.importeTotal=parseFloat(o.importeTotal)||0;o.totalTasas=parseFloat(o.totalTasas)||0;return o});if(remoto.length){expedientes=remoto;guardarLocal();renderLista()}}}).catch(()=>{})}
function getListaGestiones(tipo){if(tipo==='EX')return['RESIDENCIA TEMPORAL POR REAGRUPACIÓN FAMILIAR','REAGRUPACIÓN FAMILIAR','RESIDENCIA TEMPORAL INICIAL CTA. AJENA','RESIDENCIA TEMPORAL INICIAL CTA. PROPIA','RENOVACIÓN RESIDENCIA Y TRABAJO CTA. AJENA','RENOVACIÓN RESIDENCIA TEMPORAL','RESIDENCIA DE LARGA DURACIÓN (TIE)','AUTORIZACIÓN DE REGRESO','MODIFICACIÓN DE AUTORIZACIÓN DE RESIDENCIA','TARJETA DE FAMILIAR DE CIUDADANO UE','SOLICITUD NIE'];return['SOLICITUD DE NACIONALIDAD POR RESIDENCIA','SOLICITUD DE NACIONALIDAD (MENOR)','EXENCIÓN EXAMEN CERVANTES (NACIONALIDAD)']}function getChecklist(tipo,gestion){const base=['Mandato firmado por el cliente','Pasaporte en vigor','NIE actual si lo tiene','Empadronamiento actualizado','Modelo de solicitud cumplimentado','Justificante pago tasa'];const extra=(gestion||'').toUpperCase().includes('REAGRUP')?['Medios económicos del reagrupante','Vínculo familiar apostillado/traducido','Informe vivienda adecuada o contrato/escritura','Autorización de residencia del reagrupante','Seguro médico si procede']:[];return tipo==='EX'?[...base,...extra]:['Mandato firmado','Pasaporte','NIE','Nacimiento apostillado/traducido','Penales país origen','Empadronamiento histórico','Tasa 790 026','CCSE/DELE']}function toggleCheckItem(id,item,marcado){const exp=expedientes.find(e=>e.id===id);if(!exp)return;exp.checklist=exp.checklist||[];if(marcado&&!exp.checklist.includes(item))exp.checklist.push(item);if(!marcado)exp.checklist=exp.checklist.filter(i=>i!==item);guardarLocal();sincronizarExpediente(exp)}
async function buscarEnMaestro(dni){if(!URL_MAESTRO||!dni||dni.length<7)return null;try{const r=await fetch(URL_MAESTRO+'?action=buscar&dni='+encodeURIComponent(dni.toUpperCase().replace(/-/g,'')));const d=await r.json();return d&&d.encontrado?d.cliente:null}catch(e){return null}}async function rellenarDesdeMaestroEX(){const nie=getVal('f_nie').trim(),st=document.getElementById('maestro-status-ex');if(!nie||nie.length<7){if(st)st.textContent='⚠ Escribe el NIE primero';return}if(st)st.textContent='🔍 Buscando...';const cli=await buscarEnMaestro(nie);if(!cli){if(st)st.textContent='❌ No encontrado';return}document.getElementById('f_cliente').value=[cli.Nombre,cli.Apellido1,cli.Apellido2].filter(Boolean).join(' ').toUpperCase();if(st)st.textContent='✅ Datos cargados'}
