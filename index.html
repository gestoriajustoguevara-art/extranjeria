<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extranjería y Nacionalidad — Gestoría Justo Guevara</title>
<style>
:root {
  --navy: #1a2e4a;
  --navy2: #243d60;
  --gold: #c9a84c;
  --gold-light: #f5ecd7;
  --cream: #faf8f3;
  --danger: #c0392b;
  --warning: #c05000;
  --success: #1a7a4a;
  --info: #1a4a90;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--cream); color: #1a1a1a; font-size: 14px; }
input, select, textarea, button { font-family: inherit; font-size: 14px; }

/* HEADER */
.header {
  background: var(--navy);
  color: white;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}
.header-left { display: flex; align-items: center; gap: 12px; }
.logo { width: 38px; height: 38px; border: 2px solid var(--gold); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: var(--gold); letter-spacing: -1px; }
.header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; }
.header-sub { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 1px; }
.btn-nuevo { background: var(--gold); color: var(--navy); border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn-nuevo:hover { background: #dbb85a; }

/* TABS */
.tabs-bar {
  background: var(--navy2);
  display: flex;
  gap: 2px;
  padding: 0 20px;
}
.tab {
  padding: 10px 20px;
  color: rgba(255,255,255,0.55);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  border-bottom: 3px solid transparent;
  transition: all 0.15s;
}
.tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.tab:hover:not(.active) { color: rgba(255,255,255,0.8); }
.tab-hojas { color: rgba(255,255,255,0.6) !important; }
.tab-hojas:hover { color: var(--gold) !important; border-bottom-color: var(--gold) !important; }

/* STATS */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 1px;
  background: #ddd;
  border-bottom: 1px solid #ddd;
}
.stat { background: white; padding: 10px 14px; text-align: center; }
.stat-num { font-size: 20px; font-weight: 600; }
.stat-num.alerta { color: var(--danger); }
.stat-num.warn { color: var(--warning); }
.stat-num.ok { color: var(--success); }
.stat-lbl { font-size: 11px; color: #666; margin-top: 1px; }

/* ALERTAS */
.alertas-bar { padding: 8px 16px; display: flex; flex-direction: column; gap: 5px; background: #fff9f0; border-bottom: 1px solid #f0d8b0; }
.alerta-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.rojo { background: #e74c3c; }
.dot.naranja { background: #e67e22; }
.dot.azul { background: #3498db; }

/* TOOLBAR */
.toolbar { padding: 10px 16px; display: flex; gap: 8px; align-items: center; background: white; border-bottom: 1px solid #e8e8e8; flex-wrap: wrap; }
.search-box { flex: 1; min-width: 200px; border: 1px solid #ddd; border-radius: 6px; padding: 7px 12px; font-size: 13px; background: #f7f7f7; outline: none; }
.search-box:focus { border-color: var(--gold); background: white; }
.filtro { padding: 6px 12px; border: 1px solid #ddd; border-radius: 20px; font-size: 12px; cursor: pointer; background: white; color: #555; transition: all 0.15s; }
.filtro.on { background: var(--navy); color: white; border-color: var(--navy); }

/* LISTA */
.lista { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }

/* TARJETA */
.tarjeta { background: white; border: 1px solid #e0e0e0; border-radius: 10px; padding: 14px 16px; cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s; border-left: 4px solid #e0e0e0; }
.tarjeta:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.1); border-color: #bbb; }
.tarjeta.borde-rojo { border-left-color: #e74c3c; }
.tarjeta.borde-naranja { border-left-color: #e67e22; }
.tarjeta.borde-verde { border-left-color: #27ae60; }
.tarjeta.borde-azul { border-left-color: #3498db; }
.tarjeta.borde-gris { border-left-color: #aaa; }

.t-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.t-num { font-size: 11px; font-weight: 600; color: var(--gold); letter-spacing: 0.5px; }
.t-tipo-badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; margin-left: 6px; }
.tipo-ex { background: #e6f0ff; color: #1a4a90; }
.tipo-na { background: #f0e6ff; color: #5a1a90; }
.t-cliente { font-size: 15px; font-weight: 600; color: #1a1a1a; }
.t-gestion { font-size: 12px; color: #666; margin-top: 2px; }
.t-menor { font-size: 11px; color: #888; font-style: italic; }

.badge-estado { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
.estado-concedido { background: #e6f5ee; color: #1a7a4a; }
.estado-denegado { background: #fdeaea; color: #c0392b; }
.estado-tramite { background: #fff5e0; color: #9a5000; }
.estado-resuelto { background: #eef0f5; color: #4a5568; }
.estado-requerimiento { background: #fff0e6; color: #c05000; }
.estado-contestado { background: #e6f0ff; color: #1a4a90; }
.estado-silencio { background: #fdeaea; color: #8a0000; }
.estado-facturado { background: #e6ffe6; color: #0a5a1a; }

.t-datos { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
.t-dato { font-size: 12px; color: #888; }
.t-dato b { color: #1a1a1a; font-weight: 500; }

/* BARRA PROGRESO */
.barra-wrap { margin: 6px 0; }
.barra-lbl { display: flex; justify-content: space-between; font-size: 11px; color: #888; margin-bottom: 3px; }
.barra { height: 5px; background: #eee; border-radius: 3px; overflow: hidden; }
.barra-fill { height: 5px; border-radius: 3px; transition: width 0.3s; }

.tags { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
.tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; border: 1px solid #e0e0e0; color: #666; }
.tag.si { background: #e6f5ee; color: #1a7a4a; border-color: #a8d5b5; }
.tag.no { background: #fdeaea; color: #c0392b; border-color: #f0a0a0; }

.t-bot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.t-vto { font-size: 11px; display: flex; align-items: center; gap: 4px; }
.t-vto.rojo { color: #c0392b; font-weight: 600; }
.t-vto.naranja { color: #c05000; font-weight: 500; }
.t-vto.verde { color: #1a7a4a; }
.t-vto.gris { color: #888; }
.t-importe { font-size: 13px; font-weight: 600; }
.t-importe.pendiente { color: #c0392b; }
.t-importe.cobrado { color: #1a7a4a; }
.t-importe.parcial { color: #c05000; }

/* MODAL */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200; overflow-y: auto; padding: 20px; }
.overlay.visible { display: flex; align-items: flex-start; justify-content: center; }
.modal { background: white; border-radius: 12px; width: 100%; max-width: 780px; margin: auto; overflow: hidden; }
.modal-header { background: var(--navy); color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
.modal-header h2 { font-size: 16px; font-weight: 600; }
.modal-close { background: none; border: none; color: white; font-size: 22px; cursor: pointer; line-height: 1; opacity: 0.7; }
.modal-close:hover { opacity: 1; }
.modal-body { padding: 20px; }
.modal-footer { padding: 14px 20px; border-top: 1px solid #eee; display: flex; justify-content: flex-end; gap: 10px; background: #fafafa; }

/* SECCIONES DEL FORMULARIO */
.seccion { margin-bottom: 20px; }
.seccion-title { font-size: 12px; font-weight: 700; color: var(--navy); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 2px solid var(--gold-light); display: flex; align-items: center; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.grid1 { display: grid; grid-template-columns: 1fr; gap: 12px; }
.campo { display: flex; flex-direction: column; gap: 4px; }
.campo label { font-size: 11px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.4px; }
.campo input, .campo select, .campo textarea {
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 13px;
  background: white;
  outline: none;
  transition: border-color 0.15s;
}
.campo input:focus, .campo select:focus, .campo textarea:focus { border-color: var(--gold); }
.campo textarea { resize: vertical; min-height: 60px; }
.campo .nota-auto { font-size: 11px; color: var(--warning); font-weight: 600; margin-top: 2px; }
.campo .nota-ok { font-size: 11px; color: var(--success); font-weight: 600; margin-top: 2px; }

/* FECHAS CALCULADAS */
.fecha-calc { background: #fff9ee; border: 1px solid #f0d890; border-radius: 6px; padding: 8px 12px; font-size: 12px; color: #7a5500; display: flex; align-items: center; gap: 6px; }
.fecha-calc.urgente { background: #fff0f0; border-color: #f0a0a0; color: #8a0000; }

/* PAGOS */
.pagos-lista { display: flex; flex-direction: column; gap: 8px; }
.pago-row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px; align-items: center; background: #f9f9f9; border: 1px solid #eee; border-radius: 6px; padding: 8px 10px; }
.btn-add-pago { background: none; border: 1px dashed #bbb; border-radius: 6px; padding: 8px; color: #888; cursor: pointer; font-size: 13px; text-align: center; width: 100%; margin-top: 6px; }
.btn-add-pago:hover { border-color: var(--gold); color: var(--gold); }
.btn-rm { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 0 4px; }
.btn-rm:hover { color: var(--danger); }

/* CHECKLIST */
.checklist { display: flex; flex-direction: column; gap: 6px; }
.check-item { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.check-item input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--navy); }
.check-item.done { color: #888; text-decoration: line-through; }

/* BUTTONS */
.btn { padding: 9px 20px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
.btn-primary { background: var(--navy); color: white; }
.btn-primary:hover { background: var(--navy2); }
.btn-secondary { background: white; color: #555; border: 1px solid #ddd; }
.btn-secondary:hover { background: #f5f5f5; }
.btn-danger { background: #fdeaea; color: var(--danger); border: 1px solid #f0c0c0; }
.btn-danger:hover { background: #fcd0d0; }
.btn-gold { background: var(--gold); color: var(--navy); }
.btn-gold:hover { background: #dbb85a; }

/* VISTA DETALLE */
.detalle-tabs { display: flex; border-bottom: 1px solid #eee; margin-bottom: 16px; }
.detalle-tab { padding: 8px 16px; font-size: 13px; color: #888; cursor: pointer; border-bottom: 2px solid transparent; }
.detalle-tab.active { color: var(--navy); border-bottom-color: var(--navy); font-weight: 600; }

/* TIMELINE */
.timeline { display: flex; flex-direction: column; gap: 0; }
.tl-item { display: flex; gap: 12px; padding: 10px 0; }
.tl-dot-wrap { display: flex; flex-direction: column; align-items: center; gap: 0; }
.tl-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; border: 2px solid #ccc; background: white; }
.tl-dot.done { background: var(--success); border-color: var(--success); }
.tl-dot.active { background: var(--warning); border-color: var(--warning); }
.tl-dot.urgent { background: var(--danger); border-color: var(--danger); }
.tl-line { width: 2px; flex: 1; background: #eee; min-height: 20px; }
.tl-content { flex: 1; padding-bottom: 4px; }
.tl-label { font-size: 12px; font-weight: 600; color: #555; }
.tl-fecha { font-size: 13px; color: #1a1a1a; }
.tl-nota { font-size: 11px; color: #e67e22; font-weight: 600; margin-top: 2px; }

/* FACTURACION */
.factura-resumen { background: #f9f9f9; border: 1px solid #eee; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
.factura-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 13px; }
.factura-row.total { border-top: 1px solid #ddd; margin-top: 6px; padding-top: 10px; font-weight: 700; font-size: 15px; }
.factura-row.pendiente { color: var(--danger); }
.estado-factura { display: flex; gap: 8px; }
.estado-factura button { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 6px; background: white; font-size: 12px; font-weight: 600; cursor: pointer; color: #555; }
.estado-factura button.sel { background: var(--navy); color: white; border-color: var(--navy); }

/* EMPTY STATE */
.empty { text-align: center; padding: 60px 20px; color: #aaa; }
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty h3 { font-size: 16px; color: #666; margin-bottom: 6px; }

/* RESPONSIVE */
@media (max-width: 600px) {
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .stats-bar { grid-template-columns: repeat(3, 1fr); }
  .pago-row { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">GJG</div>
    <div>
      <div class="header h1" style="font-size:15px;font-weight:600;">Gestoría Justo Guevara</div>
      <div class="header-sub">Extranjería · Nacionalidad · Colegiado nº 493</div>
    </div>
  </div>
  <button class="btn-nuevo" onclick="abrirNuevo()">+ Nuevo expediente</button>
</div>

<div class="tabs-bar">
  <div class="tab active" onclick="setTab('todos',this)">Todos</div>
  <div class="tab" onclick="setTab('EX',this)">🌍 Extranjería</div>
  <div class="tab" onclick="setTab('NA',this)">🇪🇸 Nacionalidad</div>
  <div class="tab tab-hojas" onclick="window.open('hojas-informativas-extranjeria.html','_blank')">📋 Hojas oficiales</div>
</div>

<div class="stats-bar" id="statsBar"></div>

<div class="alertas-bar" id="alertasBar" style="display:none;"></div>

<div class="toolbar">
  <input class="search-box" id="buscador" placeholder="Buscar cliente, NIE, nº expediente, gestión..." oninput="renderLista()">
  <button class="filtro on" onclick="setFiltro('todos',this)">Todos</button>
  <button class="filtro" onclick="setFiltro('tramite',this)">En trámite</button>
  <button class="filtro" onclick="setFiltro('vencimientos',this)">⚠ Vencimientos</button>
  <button class="filtro" onclick="setFiltro('pendiente',this)">Pendiente cobro</button>
  <button class="filtro" onclick="setFiltro('cerrados',this)">Cerrados</button>
</div>

<div class="lista" id="listaExp"></div>

<!-- MODAL FORMULARIO / DETALLE -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Nuevo expediente</h2>
      <button class="modal-close" onclick="cerrarModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// APPS SCRIPT URL — sustituir por la URL real al desplegar
// ═══════════════════════════════════════════════════════
const APPS_SCRIPT_URL = 'TU_URL_APPS_SCRIPT_AQUI';

// ═══════════════════════════════════════════════════════
// DATOS
// ═══════════════════════════════════════════════════════
let expedientes = JSON.parse(localStorage.getItem('extExpedientes') || '[]');
let tabActual = 'todos';
let filtroActual = 'todos';
let expEditando = null;

// Si no hay datos, cargamos los 10 del Excel
if (expedientes.length === 0) {
  expedientes = getDatosIniciales();
  guardarLocal();
}

// ═══════════════════════════════════════════════════════
// UTILIDADES FECHA
// ═══════════════════════════════════════════════════════
function hoy() { return new Date(); }
function fD(d) {
  if (!d) return '—';
  try {
    const p = String(d).split('T')[0].split('-');
    if (p.length === 3 && p[0].length === 4) return p[2] + '/' + p[1] + '/' + p[0].slice(-2);
  } catch(e) {}
  return d;
}
function sumarDias(fecha, dias) {
  if (!fecha) return null;
  const d = new Date(fecha);
  d.setDate(d.getDate() + dias);
  return d.toISOString().split('T')[0];
}
function sumarMeses(fecha, meses) {
  if (!fecha) return null;
  const d = new Date(fecha);
  d.setMonth(d.getMonth() + meses);
  return d.toISOString().split('T')[0];
}
function sumarAnios(fecha, anios) {
  if (!fecha) return null;
  const d = new Date(fecha);
  d.setFullYear(d.getFullYear() + anios);
  return d.toISOString().split('T')[0];
}
function diasRestantes(fecha) {
  if (!fecha) return null;
  const diff = new Date(fecha) - new Date();
  return Math.ceil(diff / 86400000);
}
function fechaHoy() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function round2(n) { const x = Number(n)||0; return Math.round((x+Number.EPSILON)*100)/100; }

// ═══════════════════════════════════════════════════════
// NUMERACIÓN
// ═══════════════════════════════════════════════════════
function nextNumExp(tipo) {
  const anio = new Date().getFullYear().toString().slice(-2);
  const prefijo = tipo + anio + '/';
  const nums = expedientes.filter(e => e.numExp && e.numExp.startsWith(prefijo))
    .map(e => parseInt(e.numExp.replace(prefijo,''))||0);
  const max = nums.length ? Math.max(...nums) : 0;
  return prefijo + String(max+1).padStart(3,'0');
}

// ═══════════════════════════════════════════════════════
// CÁLCULOS AUTOMÁTICOS
// ═══════════════════════════════════════════════════════
function calcFechas(exp) {
  const c = {};
  if (exp.tipo === 'EX') {
    c.limPagoTasas = exp.fechaReqTasas ? sumarDias(exp.fechaReqTasas, 10) : null;
    c.limRespReq = exp.fechaRecepReq ? sumarDias(exp.fechaRecepReq, 10) : null;
    c.silencioAdm = exp.fechaPresentacion ? sumarMeses(exp.fechaPresentacion, 3) : null;
  } else {
    c.limRespReq = exp.fechaRecepReq ? sumarMeses(exp.fechaRecepReq, 3) : null;
    c.silencioAdm = exp.fechaPresentacion ? sumarAnios(exp.fechaPresentacion, 2) : null;
  }
  return c;
}

function calcFinanciero(exp) {
  const pagos = exp.pagos || [];
  const cobrado = pagos.reduce((s,p) => s + (round2(p.importe)||0), 0);
  const total = round2(exp.importeTotal)||0;
  const pendiente = round2(total - cobrado);
  return { cobrado: round2(cobrado), total, pendiente };
}

// ═══════════════════════════════════════════════════════
// ESTADO BORDE TARJETA
// ═══════════════════════════════════════════════════════
function getBorde(exp) {
  const fc = calcFechas(exp);
  const hoyStr = fechaHoy();
  const estados_cerrado = ['CONCEDIDO','DENEGADO','RESUELTO','ARCHIVADO'];
  if (estados_cerrado.includes(exp.estado)) return 'borde-verde';
  if (fc.limPagoTasas && fc.limPagoTasas <= hoyStr && !exp.fechaPagoTasas) return 'borde-rojo';
  if (fc.limRespReq && fc.limRespReq <= hoyStr && !exp.fechaPresReq) return 'borde-rojo';
  if (fc.limRespReq && diasRestantes(fc.limRespReq) <= 5 && !exp.fechaPresReq) return 'borde-rojo';
  if (fc.limRespReq && diasRestantes(fc.limRespReq) <= 15 && !exp.fechaPresReq) return 'borde-naranja';
  if (fc.limPagoTasas && diasRestantes(fc.limPagoTasas) <= 5 && !exp.fechaPagoTasas) return 'borde-naranja';
  if (!exp.fechaPresentacion) return 'borde-azul';
  return 'borde-gris';
}

// ═══════════════════════════════════════════════════════
// ESTADÍSTICAS
// ═══════════════════════════════════════════════════════
function renderStats() {
  const lista = filtrarPorTab();
  const total = lista.length;
  const concedidos = lista.filter(e => e.estado === 'CONCEDIDO').length;
  const tramite = lista.filter(e => !['CONCEDIDO','DENEGADO','RESUELTO','ARCHIVADO'].includes(e.estado)).length;
  const hoyStr = fechaHoy();
  let vencim = 0;
  lista.forEach(e => {
    const fc = calcFechas(e);
    if (fc.limPagoTasas && fc.limPagoTasas <= hoyStr && !e.fechaPagoTasas) vencim++;
    else if (fc.limRespReq && fc.limRespReq <= hoyStr && !e.fechaPresReq) vencim++;
    else if (fc.limRespReq && diasRestantes(fc.limRespReq) <= 7 && !e.fechaPresReq) vencim++;
  });
  const pendiente = lista.reduce((s,e) => {
    const f = calcFinanciero(e); return s + (f.pendiente > 0 ? f.pendiente : 0);
  }, 0);
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="stat-num">${total}</div><div class="stat-lbl">Total</div></div>
    <div class="stat"><div class="stat-num ok">${concedidos}</div><div class="stat-lbl">Concedidos</div></div>
    <div class="stat"><div class="stat-num warn">${tramite}</div><div class="stat-lbl">En trámite</div></div>
    <div class="stat"><div class="stat-num alerta">${vencim}</div><div class="stat-lbl">⚠ Vencimientos</div></div>
    <div class="stat"><div class="stat-num alerta">${round2(pendiente).toLocaleString('es-ES',{minimumFractionDigits:0})}€</div><div class="stat-lbl">Pendiente cobro</div></div>
  `;
}

// ═══════════════════════════════════════════════════════
// ALERTAS
// ═══════════════════════════════════════════════════════
function renderAlertas() {
  const hoyStr = fechaHoy();
  const alertas = [];
  filtrarPorTab().forEach(e => {
    const fc = calcFechas(e);
    if (fc.limPagoTasas && !e.fechaPagoTasas) {
      const d = diasRestantes(fc.limPagoTasas);
      if (d <= 10) alertas.push({ tipo: d<=0?'rojo':'naranja', texto: `<b>${e.cliente}</b> (${e.numExp}) — Límite pago tasas: ${fD(fc.limPagoTasas)} ${d<=0?'— VENCIDO':'— '+d+' días'}` });
    }
    if (fc.limRespReq && !e.fechaPresReq) {
      const d = diasRestantes(fc.limRespReq);
      if (d <= 15) alertas.push({ tipo: d<=0?'rojo':'naranja', texto: `<b>${e.cliente}</b> (${e.numExp}) — Límite respuesta req.: ${fD(fc.limRespReq)} ${d<=0?'— VENCIDO':'— '+d+' días'}` });
    }
  });
  const bar = document.getElementById('alertasBar');
  if (alertas.length === 0) { bar.style.display='none'; return; }
  bar.style.display='flex';
  bar.innerHTML = alertas.map(a => `<div class="alerta-item"><div class="dot ${a.tipo}"></div><span style="font-size:12px;">${a.texto}</span></div>`).join('');
}

// ═══════════════════════════════════════════════════════
// FILTRADO
// ═══════════════════════════════════════════════════════
function filtrarPorTab() {
  if (tabActual === 'todos') return expedientes;
  return expedientes.filter(e => e.tipo === tabActual);
}

function filtrarLista() {
  let lista = filtrarPorTab();
  const q = (document.getElementById('buscador')?.value||'').toLowerCase();
  if (q) lista = lista.filter(e =>
    (e.cliente||'').toLowerCase().includes(q) ||
    (e.numExp||'').toLowerCase().includes(q) ||
    (e.nie||'').toLowerCase().includes(q) ||
    (e.gestion||'').toLowerCase().includes(q) ||
    (e.numExtj||'').toLowerCase().includes(q) ||
    (e.otrosClientes||'').toLowerCase().includes(q)
  );
  const hoyStr = fechaHoy();
  if (filtroActual === 'tramite') lista = lista.filter(e => !['CONCEDIDO','DENEGADO','RESUELTO','ARCHIVADO'].includes(e.estado));
  if (filtroActual === 'cerrados') lista = lista.filter(e => ['CONCEDIDO','DENEGADO','RESUELTO','ARCHIVADO'].includes(e.estado));
  if (filtroActual === 'pendiente') lista = lista.filter(e => calcFinanciero(e).pendiente > 0);
  if (filtroActual === 'vencimientos') lista = lista.filter(e => {
    const fc = calcFechas(e);
    if (fc.limPagoTasas && !e.fechaPagoTasas && diasRestantes(fc.limPagoTasas) <= 15) return true;
    if (fc.limRespReq && !e.fechaPresReq && diasRestantes(fc.limRespReq) <= 15) return true;
    return false;
  });
  return lista;
}

// ═══════════════════════════════════════════════════════
// RENDER LISTA
// ═══════════════════════════════════════════════════════
function renderLista() {
  renderStats();
  renderAlertas();
  const lista = filtrarLista();
  const cont = document.getElementById('listaExp');
  if (lista.length === 0) {
    cont.innerHTML = `<div class="empty"><div class="empty-icon">📂</div><h3>No hay expedientes</h3><p>Pulsa "Nuevo expediente" para empezar</p></div>`;
    return;
  }
  cont.innerHTML = lista.map(e => renderTarjeta(e)).join('');
}

function renderTarjeta(e) {
  const fc = calcFechas(e);
  const fin = calcFinanciero(e);
  const borde = getBorde(e);
  const tipoBadge = e.tipo === 'EX' ? '<span class="t-tipo-badge tipo-ex">Extranjería</span>' : '<span class="t-tipo-badge tipo-na">Nacionalidad</span>';
  const estadoClass = {
    'CONCEDIDO':'estado-concedido','DENEGADO':'estado-denegado','EN TRÁMITE':'estado-tramite',
    'REQUERIMIENTO':'estado-requerimiento','CONTESTADO REQUERIMIENTO':'estado-contestado',
    'RESUELTO':'estado-resuelto','SILENCIO ADM.':'estado-silencio','ARCHIVADO':'estado-resuelto'
  }[e.estado] || 'estado-tramite';

  let vtoHtml = '';
  const hoyStr = fechaHoy();
  if (e.tipo === 'EX' && fc.limPagoTasas && !e.fechaPagoTasas) {
    const d = diasRestantes(fc.limPagoTasas);
    vtoHtml = `<div class="t-vto ${d<=0?'rojo':d<=5?'rojo':'naranja'}">⚠ Lím. tasas: ${fD(fc.limPagoTasas)}${d<=0?' VENCIDO':' ('+d+'d)'}</div>`;
  } else if (fc.limRespReq && !e.fechaPresReq) {
    const d = diasRestantes(fc.limRespReq);
    vtoHtml = `<div class="t-vto ${d<=0?'rojo':d<=7?'rojo':d<=15?'naranja':'gris'}">⚠ Lím. req: ${fD(fc.limRespReq)}${d<=0?' VENCIDO':' ('+d+'d)'}</div>`;
  } else if (e.tipo === 'EX' && fc.limPagoTasas && e.fechaPagoTasas) {
    vtoHtml = `<div class="t-vto verde">✓ Tasas pagadas ${fD(e.fechaPagoTasas)}</div>`;
  } else if (fc.limRespReq && e.fechaPresReq) {
    vtoHtml = `<div class="t-vto verde">✓ Req. presentado ${fD(e.fechaPresReq)}</div>`;
  } else if (fc.silencioAdm) {
    vtoHtml = `<div class="t-vto gris">Silencio adm: ${fD(fc.silencioAdm)}</div>`;
  }

  const impClass = fin.pendiente > 0 ? 'pendiente' : fin.pendiente === 0 && fin.total > 0 ? 'cobrado' : 'parcial';
  const impTexto = fin.pendiente > 0 ? `Pendiente: ${fin.pendiente.toLocaleString('es-ES')}€` : fin.total > 0 ? 'Cobrado ✓' : '';

  const menor = e.esMenor ? `<div class="t-menor">Menor — Factura: ${e.titularFactura||'—'}</div>` : '';

  const pasos = e.tipo === 'EX'
    ? [!!e.fechaCreacion, !!e.fechaPresentacion, !!e.fechaPagoTasas, !!e.fechaPresReq || !e.fechaRecepReq, !!e.estado && ['CONCEDIDO','DENEGADO','RESUELTO'].includes(e.estado)]
    : [!!e.fechaCreacion, !!e.fechaPresentacion, !!e.fechaPresReq || !e.fechaRecepReq, !!e.estado && ['CONCEDIDO','DENEGADO','RESUELTO'].includes(e.estado)];
  const pct = Math.round(pasos.filter(Boolean).length / pasos.length * 100);
  const barColor = e.estado==='CONCEDIDO'?'#27ae60':e.estado==='DENEGADO'?'#e74c3c':e.estado==='REQUERIMIENTO'?'#e67e22':'#3498db';

  return `<div class="tarjeta ${borde}" onclick="abrirDetalle('${e.id}')">
    <div class="t-top">
      <div>
        <div><span class="t-num">${e.numExp}</span>${tipoBadge}</div>
        <div class="t-cliente">${e.cliente}</div>
        <div class="t-gestion">${e.gestion}</div>
        ${menor}
      </div>
      <div class="badge-estado ${estadoClass}">${e.estado||'EN TRÁMITE'}</div>
    </div>
    <div class="t-datos">
      ${e.nie?`<div class="t-dato">NIE/Pas: <b>${e.nie}</b></div>`:''}
      ${e.otrosClientes?`<div class="t-dato">Otros: <b>${e.otrosClientes}</b></div>`:''}
      ${e.numExtj?`<div class="t-dato">Nº Extj: <b>${e.numExtj}</b></div>`:''}
      ${e.tipo==='EX'&&e.totalTasas?`<div class="t-dato">Tasas: <b>${e.totalTasas}€</b></div>`:''}
    </div>
    <div class="barra-wrap">
      <div class="barra-lbl"><span>Progreso</span><span>${pct}%</span></div>
      <div class="barra"><div class="barra-fill" style="width:${pct}%;background:${barColor};"></div></div>
    </div>
    <div class="tags">
      ${e.docCompleta==='SI'?'<span class="tag si">Doc. completa</span>':'<span class="tag no">Doc. incompleta</span>'}
      ${e.fechaPresentacion?'<span class="tag si">Presentado</span>':'<span class="tag no">Sin presentar</span>'}
      ${e.tipo==='EX'?(e.tasasPagadas==='SI'?'<span class="tag si">Tasas pagadas</span>':'<span class="tag no">Tasas pendientes</span>'):''}
      ${e.estadoFactura==='FACTURADO'?'<span class="tag si">Facturado</span>':e.estadoFactura==='LISTO'?'<span class="tag" style="background:#fff5e0;color:#9a5000;border-color:#f0c070;">Listo facturar</span>':''}
    </div>
    <div class="t-bot">
      ${vtoHtml}
      <div class="t-importe ${impClass}">${impTexto}</div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════
// FORMULARIO NUEVO / EDITAR
// ═══════════════════════════════════════════════════════
function abrirNuevo() {
  expEditando = null;
  document.getElementById('modalTitle').textContent = 'Nuevo expediente';
  document.getElementById('modalBody').innerHTML = renderFormulario(null);
  document.getElementById('modalFooter').innerHTML = `
    <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="guardarExp()">Guardar expediente</button>
  `;
  iniciarFormulario(null);
  document.getElementById('overlay').classList.add('visible');
}

function abrirDetalle(id) {
  const exp = expedientes.find(e => e.id === id);
  if (!exp) return;
  expEditando = id;
  document.getElementById('modalTitle').textContent = exp.numExp + ' — ' + exp.cliente;
  document.getElementById('modalBody').innerHTML = renderDetalle(exp);
  document.getElementById('modalFooter').innerHTML = `
    <button class="btn btn-danger" onclick="eliminarExp('${id}')">Eliminar</button>
    <button class="btn btn-secondary" onclick="cerrarModal()">Cerrar</button>
    <button class="btn btn-primary" onclick="editarExp('${id}')">Editar</button>
  `;
  document.getElementById('overlay').classList.add('visible');
}

function editarExp(id) {
  const exp = expedientes.find(e => e.id === id);
  if (!exp) return;
  expEditando = id;
  document.getElementById('modalTitle').textContent = 'Editar — ' + exp.numExp;
  document.getElementById('modalBody').innerHTML = renderFormulario(exp);
  document.getElementById('modalFooter').innerHTML = `
    <button class="btn btn-secondary" onclick="abrirDetalle('${id}')">Cancelar</button>
    <button class="btn btn-primary" onclick="guardarExp()">Guardar cambios</button>
  `;
  iniciarFormulario(exp);
  document.getElementById('overlay').classList.add('visible');
}

function renderDetalle(exp) {
  const fc = calcFechas(exp);
  const fin = calcFinanciero(exp);

  const timeline = e => {
    const pasos = e.tipo === 'EX' ? [
      { label:'Apertura expediente', fecha:e.fechaCreacion, done:!!e.fechaCreacion },
      { label:'Documentación completa', fecha:null, done:e.docCompleta==='SI' },
      { label:'Presentación solicitud', fecha:e.fechaPresentacion, done:!!e.fechaPresentacion },
      { label:'Requerimiento de tasas', fecha:e.fechaReqTasas, done:!!e.fechaReqTasas },
      { label:'Límite pago tasas (+10 días)', fecha:fc.limPagoTasas, done:!!e.fechaPagoTasas, calc:true, urgente:fc.limPagoTasas&&!e.fechaPagoTasas&&diasRestantes(fc.limPagoTasas)<=5 },
      { label:'Pago de tasas', fecha:e.fechaPagoTasas, done:!!e.fechaPagoTasas },
      { label:'Presentación de tasas', fecha:e.fechaPresTasas, done:!!e.fechaPresTasas },
      { label:'Recepción requerimiento documental', fecha:e.fechaRecepReq, done:!!e.fechaRecepReq },
      { label:'Límite respuesta requerimiento (+10 días)', fecha:fc.limRespReq, done:!!e.fechaPresReq, calc:true, urgente:fc.limRespReq&&!e.fechaPresReq&&diasRestantes(fc.limRespReq)<=5 },
      { label:'Presentación requerimiento', fecha:e.fechaPresReq, done:!!e.fechaPresReq },
      { label:'Silencio administrativo (3 meses)', fecha:fc.silencioAdm, done:false, calc:true },
      { label:'Respuesta / Resolución', fecha:e.fechaRespuesta, done:!!e.fechaRespuesta },
    ] : [
      { label:'Apertura expediente', fecha:e.fechaCreacion, done:!!e.fechaCreacion },
      { label:'Documentación completa + tasa pagada', fecha:null, done:e.docCompleta==='SI' },
      { label:'Presentación solicitud', fecha:e.fechaPresentacion, done:!!e.fechaPresentacion },
      { label:'Recepción requerimiento', fecha:e.fechaRecepReq, done:!!e.fechaRecepReq },
      { label:'Límite respuesta requerimiento (3 meses)', fecha:fc.limRespReq, done:!!e.fechaPresReq, calc:true, urgente:fc.limRespReq&&!e.fechaPresReq&&diasRestantes(fc.limRespReq)<=10 },
      { label:'Presentación requerimiento', fecha:e.fechaPresReq, done:!!e.fechaPresReq },
      { label:'Silencio administrativo (2 años)', fecha:fc.silencioAdm, done:false, calc:true },
      { label:'Resolución', fecha:e.fechaRespuesta, done:!!e.fechaRespuesta },
    ];
    return `<div class="timeline">${pasos.map((p,i) => `
      <div class="tl-item">
        <div class="tl-dot-wrap">
          <div class="tl-dot ${p.done?'done':p.urgente?'urgent':''}"></div>
          ${i<pasos.length-1?'<div class="tl-line"></div>':''}
        </div>
        <div class="tl-content">
          <div class="tl-label" style="${p.calc?'color:#888;font-style:italic;':''}">${p.label}</div>
          <div class="tl-fecha">${p.fecha?fD(p.fecha):'—'}</div>
          ${p.urgente?`<div class="tl-nota">⚠ ${diasRestantes(p.fecha)<=0?'VENCIDO':'Quedan '+diasRestantes(p.fecha)+' días'}</div>`:''}
        </div>
      </div>`).join('')}</div>`;
  };

  const pagosHtml = (exp.pagos||[]).map((p,i) => `
    <div class="factura-row">
      <span>${p.fecha?fD(p.fecha):'—'}${p.recibo?' · Recibo '+p.recibo:''}</span>
      <span style="font-weight:600;">${round2(p.importe).toLocaleString('es-ES',{minimumFractionDigits:2})}€</span>
    </div>`).join('') || '<div style="color:#aaa;font-size:13px;">Sin pagos registrados</div>';

  const checklistHtml = getChecklist(exp.tipo, exp.gestion).map(item => {
    const marcado = (exp.checklist||[]).includes(item);
    return `<div class="check-item ${marcado?'done':''}"><input type="checkbox" ${marcado?'checked':''} disabled> ${item}</div>`;
  }).join('');

  const menor = exp.esMenor ? `<div style="background:#fff9ee;border:1px solid #f0d890;border-radius:6px;padding:10px 14px;margin-bottom:12px;font-size:13px;">
    <b>Cliente menor de edad</b> — Titular factura: <b>${exp.titularFactura||'—'}</b> · DNI titular: <b>${exp.dniTitular||'—'}</b>
  </div>` : '';

  return `
    <div style="margin-bottom:12px;">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <span class="badge-estado ${exp.tipo==='EX'?'estado-tramite':'estado-contestado'}" style="font-size:13px;">${exp.tipo==='EX'?'🌍 Extranjería':'🇪🇸 Nacionalidad'}</span>
        <span style="font-size:13px;color:#666;">${exp.gestion}</span>
      </div>
      ${exp.nie?`<div style="margin-top:6px;font-size:13px;color:#555;">NIE/Pasaporte: <b>${exp.nie}</b>${exp.otrosClientes?' · Otros: <b>'+exp.otrosClientes+'</b>':''}</div>`:''}
      ${exp.numExtj?`<div style="font-size:13px;color:#555;">Nº Extranjería: <b>${exp.numExtj}</b></div>`:''}
      ${exp.observaciones?`<div style="margin-top:8px;font-size:13px;color:#444;background:#f9f9f9;border-radius:6px;padding:8px 12px;">${exp.observaciones}</div>`:''}
    </div>

    <div class="detalle-tabs">
      <div class="detalle-tab active" onclick="switchDetalleTab(this,'tab-timeline')">Cronología</div>
      <div class="detalle-tab" onclick="switchDetalleTab(this,'tab-factura')">Facturación</div>
      <div class="detalle-tab" onclick="switchDetalleTab(this,'tab-checklist')">Documentación</div>

        <div class="factura-row"><span style="color:#888;">Titular factura</span><span style="font-weight:600;">${exp.esMenor?(exp.titularFactura||'—'):exp.cliente}</span></div>
        <div class="factura-row"><span style="color:#888;">Importe total servicio</span><span style="font-weight:600;">${round2(exp.importeTotal).toLocaleString('es-ES',{minimumFractionDigits:2})}€</span></div>
        <div style="border-top:1px solid #eee;margin:6px 0;padding-top:8px;font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.5px;">Pagos recibidos</div>
        ${pagosHtml}
        <div class="factura-row total ${fin.pendiente>0?'pendiente':''}">
          <span>${fin.pendiente>0?'Pendiente de cobro':'✓ Cobrado total'}</span>
          <span>${fin.pendiente>0?fin.pendiente.toLocaleString('es-ES',{minimumFractionDigits:2})+'€':fin.cobrado.toLocaleString('es-ES',{minimumFractionDigits:2})+'€'}</span>
        </div>
      </div>
      <div style="font-size:12px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">Estado de facturación</div>
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        ${['EN TRÁMITE','LISTO','FACTURADO'].map(s=>`
          <button onclick="cambiarEstadoFactura('${exp.id}','${s}')" style="flex:1;padding:8px;border:1px solid ${exp.estadoFactura===s?'#1a2e4a':'#ddd'};border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;color:${exp.estadoFactura===s?'white':'#555'};background:${exp.estadoFactura===s?'#1a2e4a':'white'};">${s}</button>
        `).join('')}
      </div>
      ${exp.estadoFactura==='FACTURADO' ? `
        <div style="background:#e8f5ee;border:1px solid #a8d5b5;border-radius:6px;padding:10px 14px;font-size:13px;">
          <b>Nº Factura:</b>
          <input type="text" id="inp_numFactura" value="${exp.numFactura||''}" placeholder="AS26/001" style="border:1px solid #ccc;border-radius:4px;padding:4px 8px;font-size:13px;margin-left:8px;width:120px;"
            onchange="guardarNumFactura('${exp.id}',this.value)">
        </div>` : ''}
    </div>
    <div id="tab-checklist" style="display:none;">
      <div style="font-size:12px;color:#888;margin-bottom:10px;">Marca los documentos que ya tienes del cliente</div>
      <div class="checklist" id="checklistInteractivo">
        ${getChecklist(exp.tipo, exp.gestion).map(item => {
          const marcado = (exp.checklist||[]).includes(item);
          return `<label class="check-item ${marcado?'done':''}">
            <input type="checkbox" ${marcado?'checked':''} onchange="toggleCheckItem('${exp.id}','${item.replace(/'/g,"\\'")}',this.checked)"> ${item}
          </label>`;
        }).join('')}
      </div>
    </div>
  `;
}

function switchDetalleTab(el, tabId) {
  document.querySelectorAll('.detalle-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  ['tab-timeline','tab-factura','tab-checklist'].forEach(id=>{
    const t = document.getElementById(id);
    if(t) t.style.display = id===tabId?'block':'none';
  });
}

  const tipo = e.tipo || 'EX';

            <option value="EX" ${tipo==='EX'?'selected':''}>🌍 Extranjería</option>

          </select>
        </div>
        <div class="campo">
          <label>Nº Expediente</label>
          <input type="text" id="f_numExp" value="${e.numExp||''}" placeholder="Auto (EX26/001)">
        </div>
      </div>
      <div class="grid1" style="margin-top:10px;">
        <div class="campo">
          <label>Tipo de gestión *</label>
          <select id="f_gestion" onchange="onGestionChange()">

// GESTIÓN PAGOS EN FORMULARIO

let pagosTemp = [];

function iniciarFormulario(exp) {
  pagosTemp = exp ? JSON.parse(JSON.stringify(exp.pagos||[])) : [];
  renderPagosForm();
  calcMostrarFechas();
}

function renderPagosForm() {
  const cont = document.getElementById('pagosLista');
  if (!cont) return;
  if (pagosTemp.length === 0) { cont.innerHTML = '<div style="color:#aaa;font-size:13px;padding:4px 0;">Sin pagos aún</div>'; return; }
  cont.innerHTML = pagosTemp.map((p,i) => `
    <div class="pago-row">
      <input type="date" value="${p.fecha||''}" onchange="pagosTemp[${i}].fecha=this.value" placeholder="Fecha">
      <input type="number" value="${p.importe||''}" onchange="pagosTemp[${i}].importe=parseFloat(this.value)||0" placeholder="Importe €" step="0.01">
      <input type="text" value="${p.recibo||''}" onchange="pagosTemp[${i}].recibo=this.value" placeholder="Nº recibo">
      <button class="btn-rm" onclick="rmPago(${i})">×</button>
    </div>`).join('');
}

function addPago() {
  pagosTemp.push({ fecha: fechaHoy(), importe: 0, recibo: '' });
  renderPagosForm();
}

function rmPago(i) {
  pagosTemp.splice(i, 1);
  renderPagosForm();
}

function calcMostrarFechas() {
  const tipo = document.getElementById('f_tipo')?.value;
  const fPres = document.getElementById('f_fechaPresentacion')?.value;
  const fReqTasas = document.getElementById('f_fechaReqTasas')?.value;
  const fRecepReq = document.getElementById('f_fechaRecepReq')?.value;

  const limTasasEl = document.getElementById('calc_limTasas');
  const limReqEl = document.getElementById('calc_limReq');
  const silencioEl = document.getElementById('calc_silencio');

  if (tipo === 'EX' && fReqTasas && limTasasEl) {
    const lim = sumarDias(fReqTasas, 10);
    const d = diasRestantes(lim);
    limTasasEl.style.display='block';
    limTasasEl.innerHTML=`<div class="fecha-calc ${d<=3?'urgente':''}">⏱ Límite pago tasas: <b>${fD(lim)}</b>${d<=0?' — VENCIDO':' (quedan '+d+' días)'}</div>`;
  } else if (limTasasEl) limTasasEl.style.display='none';

  if (fRecepReq && limReqEl) {
    const lim = tipo==='EX' ? sumarDias(fRecepReq,10) : sumarMeses(fRecepReq,3);
    const d = diasRestantes(lim);
    limReqEl.style.display='block';
    limReqEl.innerHTML=`<div class="fecha-calc ${d<=5?'urgente':''}">⏱ Límite respuesta requerimiento: <b>${fD(lim)}</b>${d<=0?' — VENCIDO':' (quedan '+d+' días)'}</div>`;
  } else if (limReqEl) limReqEl.style.display='none';

  if (fPres && silencioEl) {
    const lim = tipo==='EX' ? sumarMeses(fPres,3) : sumarAnios(fPres,2);
    silencioEl.style.display='block';
    silencioEl.innerHTML=`<div class="fecha-calc">📅 Silencio administrativo: <b>${fD(lim)}</b></div>`;
  } else if (silencioEl) silencioEl.style.display='none';
}

function onTipoChange() {
  const tipo = document.getElementById('f_tipo')?.value;
  const bloqueEx = document.getElementById('bloque_fechas_ex');
  if (bloqueEx) bloqueEx.style.display = tipo==='EX'?'block':'none';
  const sel = document.getElementById('f_gestion');
  if (sel) {
    sel.innerHTML = '<option value="">— Seleccionar —</option>' +
      getListaGestiones(tipo).map(g=>`<option value="${g}">${g}</option>`).join('') +
      '<option value="OTRO">Otro (escribir)</option>';
  }
  const numEl = document.getElementById('f_numExp');
  if (numEl && !numEl.value) numEl.value = nextNumExp(tipo);
  calcMostrarFechas();
}

function onGestionChange() {
  const v = document.getElementById('f_gestion')?.value;
  const libre = document.getElementById('campo_gestion_libre');
  if (libre) libre.style.display = v==='OTRO'?'grid':'none';
}

function toggleMenor() {

// ═══════════════════════════════════════════════════════
// GUARDAR
// ═══════════════════════════════════════════════════════
function guardarExp() {
  const tipo = document.getElementById('f_tipo')?.value || 'EX';
  const gestionSel = document.getElementById('f_gestion')?.value || '';
  const gestion = gestionSel === 'OTRO' ? (document.getElementById('f_gestion_libre')?.value||'') : gestionSel;
  const cliente = (document.getElementById('f_cliente')?.value||'').trim().toUpperCase();

  if (!cliente) { alert('El nombre del cliente es obligatorio'); return; }
  if (!gestion) { alert('El tipo de gestión es obligatorio'); return; }

  const numExpInput = (document.getElementById('f_numExp')?.value||'').trim();
  const numExp = numExpInput || nextNumExp(tipo);

  const exp = {
    id: expEditando || ('exp_' + Date.now()),
    tipo, numExp, gestion, cliente,
    nie: (document.getElementById('f_nie')?.value||'').toUpperCase(),
    otrosClientes: document.getElementById('f_otros')?.value||'',
    numExtj: document.getElementById('f_numExtj')?.value||'',
    esMenor: document.getElementById('f_menor')?.checked||false,
    titularFactura: (document.getElementById('f_titular')?.value||'').toUpperCase(),
    dniTitular: (document.getElementById('f_dniTitular')?.value||'').toUpperCase(),
    fechaCreacion: document.getElementById('f_fechaCreacion')?.value||'',
    docCompleta: document.getElementById('f_docCompleta')?.value||'NO',
    fechaPresentacion: document.getElementById('f_fechaPresentacion')?.value||'',
    fechaRecepReq: document.getElementById('f_fechaRecepReq')?.value||'',
    fechaPresReq: document.getElementById('f_fechaPresReq')?.value||'',
    fechaRespuesta: document.getElementById('f_fechaRespuesta')?.value||'',
    estado: document.getElementById('f_estado')?.value||'EN TRÁMITE',
    traduccion: document.getElementById('f_traduccion')?.value||'NO',
    importeTotal: parseFloat(document.getElementById('f_importeTotal')?.value)||0,
    estadoFactura: document.getElementById('f_estadoFactura')?.value||'EN TRÁMITE',
    observaciones: document.getElementById('f_observaciones')?.value||'',
    pagos: pagosTemp,
    checklist: expEditando ? (expedientes.find(e=>e.id===expEditando)?.checklist||[]) : [],
  };

  if (tipo === 'EX') {
    exp.totalTasas = parseFloat(document.getElementById('f_totalTasas')?.value)||0;
    exp.tasasPagadas = document.getElementById('f_tasasPagadas')?.value||'NO';
    exp.tasasPresentadas = document.getElementById('f_tasasPresentadas')?.value||'NO';
    exp.fechaReqTasas = document.getElementById('f_fechaReqTasas')?.value||'';
    exp.fechaPagoTasas = document.getElementById('f_fechaPagoTasas')?.value||'';
    exp.fechaPresTasas = document.getElementById('f_fechaPresTasas')?.value||'';
  }

  if (expEditando) {
    const idx = expedientes.findIndex(e=>e.id===expEditando);
    if (idx>=0) expedientes[idx] = exp;
  } else {
    expedientes.push(exp);
  }

  guardarLocal();
  sincronizarSheets();
  enviarVencimientosExt(exp);
  cerrarModal();
  renderLista();
}

// ════════════ VENCIMIENTOS CENTRALES ════════════
const URL_VTO_EXT = 'https://script.google.com/macros/s/AKfycbzSpWjKLGxRp4CR4miJk4uP7b6CNmmToqGrleJXbEtQX9T6BdRyLkMReE5lBGxVk5i9SA/exec';

function enviarVencimientosExt(exp) {
  const estadosCerrados = ['CONCEDIDO','DENEGADO','RESUELTO','ARCHIVADO','CERRADO'];
  const cerrado = estadosCerrados.includes((exp.estado||'').toUpperCase());

  function upsert(fecha, tipo, obs) {
    if (!fecha) return;
    fetch(URL_VTO_EXT, { method:'POST', mode:'no-cors', body: JSON.stringify({
      action:'upsert', app:'Extranjería',
      expediente: exp.numExp, cliente: exp.cliente,
      fecha, tipo, observaciones: obs||exp.gestion||'', estado:'Pendiente'
    })});
  }

  function completar(tipo) {
    fetch(URL_VTO_EXT, { method:'POST', mode:'no-cors', body: JSON.stringify({
      action:'completar', app:'Extranjería', expediente: exp.numExp, tipo
    })});
  }

  if (cerrado) {
    ['Límite respuesta requerimiento','Límite pago tasas'].forEach(completar);
    return;
  }

  if (exp.fechaRecepReq && !exp.fechaPresReq) {
    const f = new Date(exp.fechaRecepReq);
    exp.tipo === 'EX' ? f.setDate(f.getDate()+10) : f.setMonth(f.getMonth()+3);
    upsert(f.toISOString().slice(0,10), 'Límite respuesta requerimiento', `Recep: ${exp.fechaRecepReq}`);
  } else if (exp.fechaPresReq) {
    completar('Límite respuesta requerimiento');
  }

  if (exp.fechaReqTasas && exp.tasasPagadas !== 'SÍ' && exp.tasasPagadas !== 'SI') {
    const ft = new Date(exp.fechaReqTasas);
    ft.setDate(ft.getDate()+10);
    upsert(ft.toISOString().slice(0,10), 'Límite pago tasas', `Req: ${exp.fechaReqTasas}`);
  } else if (exp.tasasPagadas === 'SÍ' || exp.tasasPagadas === 'SI') {
    completar('Límite pago tasas');
  }
}

function eliminarExp(id) {
  if (!confirm('¿Eliminar este expediente? Esta acción no se puede deshacer.')) return;
  expedientes = expedientes.filter(e=>e.id!==id);
  guardarLocal();
  sincronizarSheets();
  cerrarModal();
  renderLista();
}

// ═══════════════════════════════════════════════════════
// PERSISTENCIA
// ═══════════════════════════════════════════════════════
function guardarLocal() {
  localStorage.setItem('extExpedientes', JSON.stringify(expedientes));
}

function sincronizarSheets() {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes('TU_URL')) return;
  const datos = [
    ['numExp','tipo','gestion','cliente','nie','otrosClientes','numExtj','esMenor','titularFactura','dniTitular',
     'fechaCreacion','docCompleta','fechaPresentacion','totalTasas','tasasPagadas','tasasPresentadas',
     'fechaReqTasas','fechaPagoTasas','fechaPresTasas','fechaRecepReq','fechaPresReq','fechaRespuesta',
     'estado','traduccion','importeTotal','estadoFactura','numFactura','pagos_json','checklist_json','observaciones'],
    ...expedientes.map(e=>[
      e.numExp,e.tipo,e.gestion,e.cliente,e.nie,e.otrosClientes,e.numExtj,e.esMenor?'SI':'NO',
      e.titularFactura,e.dniTitular,e.fechaCreacion,e.docCompleta,e.fechaPresentacion,
      e.totalTasas||0,e.tasasPagadas||'',e.tasasPresentadas||'',
      e.fechaReqTasas||'',e.fechaPagoTasas||'',e.fechaPresTasas||'',
      e.fechaRecepReq,e.fechaPresReq,e.fechaRespuesta,e.estado,e.traduccion,
      e.importeTotal,e.estadoFactura,e.numFactura||'',JSON.stringify(e.pagos||[]),JSON.stringify(e.checklist||[]),e.observaciones
    ])
  ];
  fetch(APPS_SCRIPT_URL, { method:'POST', mode:'no-cors', body: JSON.stringify({ action:'escribir', hoja:'ExtranjeriaExp', datos }) });
}

function cargarDeSheets() {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes('TU_URL')) return;
  fetch(APPS_SCRIPT_URL + '?action=leer&hoja=ExtranjeriaExp')
    .then(r=>r.json()).then(d=>{
      if (d && d.length > 1) {
        const [cab,...filas] = d;
        const remoto = filas.filter(f=>f[0]).map(f=>{
          const o = {};
          cab.forEach((c,i)=>o[c]=f[i]);
          o.pagos = (() => { try { return JSON.parse(o.pagos_json||'[]'); } catch(e){ return []; } })();
          o.checklist = (() => { try { return JSON.parse(o.checklist_json||'[]'); } catch(e){ return []; } })();
          o.id = o.id || ('exp_'+o.numExp);
          o.esMenor = o.esMenor === 'SI';
          o.importeTotal = parseFloat(o.importeTotal)||0;
          o.totalTasas = parseFloat(o.totalTasas)||0;
          return o;
        });
        if (remoto.length) { expedientes = remoto; guardarLocal(); renderLista(); }
        else if (expedientes.length) sincronizarSheets();
      }
    }).catch(()=>{});
}

// CONTROLES UI
// ═══════════════════════════════════════════════════════
function setTab(tab, el) {
  tabActual = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderLista();
}

function setFiltro(f, el) {
  filtroActual = f;
  document.querySelectorAll('.filtro').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  renderLista();
}

function cerrarModal() {
  document.getElementById('overlay').classList.remove('visible');
  expEditando = null;
  pagosTemp = [];
}

function cambiarEstadoFactura(id, nuevoEstado) {
  const exp = expedientes.find(e=>e.id===id);
  if (!exp) return;
  exp.estadoFactura = nuevoEstado;
  guardarLocal();
  sincronizarSheets();
  document.getElementById('modalBody').innerHTML = renderDetalle(exp);
  switchDetalleTab(document.querySelector('.detalle-tab'), 'tab-factura');
  document.querySelectorAll('.detalle-tab').forEach((t,i)=> i===1 ? t.classList.add('active') : t.classList.remove('active'));
  document.getElementById('tab-factura').style.display='block';
  document.getElementById('tab-timeline').style.display='none';
  document.getElementById('tab-checklist').style.display='none';
  renderLista();
}

function guardarNumFactura(id, numFactura) {
  const exp = expedientes.find(e=>e.id===id);
  if (!exp) return;
  exp.numFactura = numFactura.trim().toUpperCase();
  guardarLocal();
  sincronizarSheets();
}

function toggleCheckItem(id, item, marcado) {
  const exp = expedientes.find(e=>e.id===id);
  if (!exp) return;
  exp.checklist = exp.checklist || [];
  if (marcado) {
    if (!exp.checklist.includes(item)) exp.checklist.push(item);
  } else {
    exp.checklist = exp.checklist.filter(i=>i!==item);
  }
  const labels = document.querySelectorAll('#checklistInteractivo label.check-item');
  labels.forEach(lbl => {
    const cb = lbl.querySelector('input[type=checkbox]');
    if (cb && cb.checked !== undefined) {
      lbl.classList.toggle('done', cb.checked);
    }
  });
  guardarLocal();
  sincronizarSheets();
}

document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) cerrarModal();
});
